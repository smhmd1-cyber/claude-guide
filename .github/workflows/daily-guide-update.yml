name: עדכון יומי — מדריך Claude

# 05:00 UTC = 08:00 בישראל (קיץ) / 07:00 (חורף). GitHub Actions תמיד ב-UTC.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:        # מאפשר גם הרצה ידנית מלשונית Actions

# ברירת-מחדל שמרנית; ההרשאות ניתנות ברמת ה-job
permissions:
  contents: read

concurrency:
  group: daily-guide-update
  cancel-in-progress: false

# חשבון ה-FTP כלוא (chroot) בתוך /home4/jmaheryc/guideclaude.jmahery.com,
# שהיא ה-document root של guideclaude.jmahery.com. לכן "./" עבורו = הכלוב עצמו,
# והוא פיזית לא יכול להגיע ל-public_html (מערכת הניהול ומדריך מרוקו).
env:
  FTP_TARGET_DIR: "./"
  FTP_EXPECTED_USER_PREFIX: "guideclaude@"
  GUIDE_SUBDOMAIN: "guideclaude.jmahery.com"

jobs:
  update:
    name: סריקה · עדכון · פריסה
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write       # נדרש כדי לדחוף את הקומיט ל-main
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: הרצת Claude — סריקה ועדכון המדריך
        uses: anthropics/claude-code-action@v1
        with:
          # טוקן מהמנוי (Max/Pro) — ללא חיוב לפי טוקנים.
          # נוצר בטרמינל עם `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # חלופה בתשלום-לפי-שימוש (דורשת אשראי ב-console.anthropic.com):
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            עדכון יומי אוטומטי של המדריך החכם האינטראקטיבי ל-Claude.

            אתה רץ בתוך GitHub Actions. **תפקידך: לסרוק ולערוך את `index.html` בלבד.** אל תעשה commit, אל תעשה push, ואל תעלה ל-FTP — ה-workflow מטפל בזה אחריך. יש אישור עומד; אל תשאל שאלות.

            ═══════════════════════════════
            **שלב 1 — סריקה עם שער שלוש-דרגות**
            ═══════════════════════════════

            **דרגה א׳ — מוסמך (עובדות נכנסות רק מכאן):**
            - https://www.anthropic.com/news
            - https://claude.com/blog
            - https://code.claude.com/docs/en/changelog
            - https://platform.claude.com/docs/en/release-notes/overview
              ⚠️ `docs.claude.com/release-notes` מפנה (302) לכתובת הזו — פנה ישירות ליעד.
            - https://platform.claude.com/docs/en/about-claude/model-deprecations
            - https://status.anthropic.com
            - https://anthropic.skilljar.com  ← ראה שלב 2

            **דרגה ב׳ — אות מהיר (נכנס רק אם אומת בדרגה א׳):**
            reddit.com/r/ClaudeAI · news.ycombinator.com · github.com/anthropics/releases

            **דרגה ג׳ — רב-לשוני (העשרה בלבד — טריקים ופרשנות, **לעולם לא עובדות**):**
            🇯🇵 zenn.dev · qiita.com · dev.classmethod.jp | 🇨🇳 juejin.cn · infoq.cn | 🇩🇪 heise | 🇫🇷 · 🇪🇸 · 🇸🇦 · 🇷🇺

            **חוקי השער:**
            - דרגה א׳ → ישר לציר-הזמן.
            - דרגה ב׳ לא-מאומת → מגירת "בבדיקה". דרגה ג׳ עובדתית → מגירת "בבדיקה".
            - דרגה ג׳ שהיא טריק/זווית → פרק הטריקים, עם קרדיט ותג-שפה (🇯🇵/🇨🇳).
            - **הכל בעברית**, גם ממקור זר. תיאור אמיתי ומועיל — לא תרגום מכונה. לינק למקור בכל פריט.
            - **אסור להמציא.** מקור שלא נטען — אמור זאת בדוח, אל תשלים מהזיכרון.

            **ספר-הנראו (מונע כפילויות):** בלוק בלתי-נראה `<!--SEEN-LEDGER-START … SEEN-LEDGER-END-->` עם שורות `YYYY-MM-DD|slug`. לפני הוספה — בדוק שה-slug לא שם. אחרי הוספה — הוסף שורה. **לעולם אל תמחק שורות ישנות.**

            **מגירת "בבדיקה"** (בין `<!--PENDING-START-->` ל-`<!--PENDING-END-->`): פריט לא-מאומת נכנס עם תאריך · אומת מאז → קדם לציר-הזמן והסר מהמגירה · בן 7+ ימים ללא אישור → הסר · מגירה ריקה → החזר את פסקת "אין כרגע פריטים בבדיקה".

            ═══════════════════════════════
            **שלב 2 — Claude Academy (מיזוג קטלוג)**
            ═══════════════════════════════
            המקור המוסמך: **anthropic.skilljar.com**. (`claude.ai/learning` הוא SPA מאחורי התחברות — לא ניתן לסריקה, קישור למשתמש בלבד.)

            שלוף את כל שמות הקורסים → השווה מול הקיימים בין `<!--ACADEMY-CATALOG-START/END-->` → קורס חדש מקבל `<tr>` באותו פורמט (`<strong>שם באנגלית</strong><br><span>תיאור בעברית</span>` + מסלול: יסודות/Claude Code/פיתוח/Cowork/MCP/Skills/ענן/AI Fluency/חינוך/מגזר). קורס שהוסר → הסר שורה. עדכן את המונה `N קורסים`, ו**תמיד** את חותמת "נבדק מול הקטלוג הרשמי" — גם ביום שקט. קורס חדש → גם פריט בציר-הזמן.

            📌 נכון ל-23/08/2026: **22 קורסים** (האחרון: AI Fluency for Creative Work).

            ═══════════════════════════════
            **שלב 3 — עדכון תוכן**
            ═══════════════════════════════
            פריטים חדשים בראש ציר-הזמן (`chapter-anthropic-news`), ואז הפרקים המושפעים, ליבת-המודלים, ופרק הטריקים (`chapter-genius-tricks`).

            **ארכיון:** פריטי ציר-זמן ישנים מ-**4 חודשים** → קפל לתוך `id="news-archive"` (בין `<!--ARCHIVE-START/END-->`): שורה מסכמת אחת לחודש + הלינקים המקוריים, והסר מציר-הזמן הפעיל. **אל תמחק מידע — רק דחוס.**

            ═══════════════════════════════
            **שלב 4 — ספירות וחותמות**
            ═══════════════════════════════
            ספירת פרקים = מספר `id="chapter-*"` ייחודיים (נכון ל-23/08/2026: **132**).
            עדכן את כל חותמות-הגרסה, התאריך והשעה האמיתיים (`TZ=Asia/Jerusalem date`), הבאנר, וכפתור "מה חדש".
            📌 הגרסה האחרונה: **v28.5 · 23/08/2026 14:53** — העלה מספר-גרסה בכל עדכון תוכן.

            ⚠️ **אל תיגע בפריטים היסטוריים מתוארכים.** ספירות ישנות (93/122/124) וחותמות (14:42/16:31/19:19/19:35) הן תיעוד, לא באג.

            ═══════════════════════════════
            **שלב 5 — בדיקה עצמית לפני סיום**
            ═══════════════════════════════
            - 8 העוגנים קיימים **פעם אחת בדיוק**: SEEN-LEDGER-START/END · PENDING-START/END · ARCHIVE-START/END · ACADEMY-CATALOG-START/END
            - בלוק ספר-הנראו נשאר הערת-HTML תקינה (`<!--` … `-->`)
            - איזון `<div>`, אין IDs כפולים, ספירת הפרקים לא ירדה
            - מספר שורות הקטלוג = המונה
            - הגרסה הישנה לא שורדת באף חותמת "נוכחית"
            - ⚠️ ידוע ולא-באג: `goTo('...')` ו-`chapter-...` הם מציין-מקום בקטע-הדגמה. אל "תתקן" אותם.

            **יום שקט?** עדיין עדכן חותמת תאריך/שעה, באנר ("סריקה שקטה…") וחותמת ה-Academy — כך רואים שהמערכת חיה.

            **דוח סיום בעברית:** מה נוסף · כמה פריטים מכל דרגה · מה נכנס ל"בבדיקה" · קורסים חדשים · מה לארכיון · ספירת פרקים · מקורות עם לינקים.
          claude_args: |
            --allowedTools "Read,Write,Edit,Bash,WebFetch,WebSearch,Glob,Grep"
            --permission-mode acceptEdits

      - name: ולידציה — לא פורסים קובץ שבור
        run: |
          set -euo pipefail
          # משווים מול הגרסה הקודמת בגיט במקום מספרי-קסם.
          git show HEAD:index.html > /tmp/prev.html
          python3 - <<'PY'
          import re, sys

          def load(p):
              return open(p, encoding='utf-8').read()

          new = load('index.html')
          old = load('/tmp/prev.html')

          def ledger_lines(h):
              m = re.search(r'SEEN-LEDGER-START(.*?)SEEN-LEDGER-END', h, re.S)
              if not m: return None
              return len([l for l in m.group(1).splitlines()
                          if re.match(r'\s*\d{4}-\d{2}-\d{2}\|', l)])

          def chapters(h):
              return len(set(re.findall(r'id="(chapter-[a-z0-9-]+)"', h)))

          errs, notes = [], []

          # --- מבנה: חייב להיות תקין תמיד ---
          for a in ['SEEN-LEDGER-START','SEEN-LEDGER-END','PENDING-START','PENDING-END',
                    'ARCHIVE-START','ARCHIVE-END','ACADEMY-CATALOG-START','ACADEMY-CATALOG-END']:
              if new.count(a) != 1:
                  errs.append(f"עוגן {a} מופיע {new.count(a)} פעמים (צריך 1)")

          if new.count('<div') != new.count('</div>'):
              errs.append(f"חוסר איזון div: {new.count('<div')} פתוחים מול {new.count('</div>')} סגורים")

          ids = re.findall(r'\sid="([^"]+)"', new)
          dups = sorted({x for x in ids if ids.count(x) > 1})
          if dups:
              errs.append(f"IDs כפולים: {dups[:5]}")

          # --- אי-רגרסיה: משווים מול הקודם ---
          ln_new, ln_old = ledger_lines(new), ledger_lines(old)
          if ln_new is None:
              errs.append("ספר-הנראו לא נמצא או נשבר")
          elif ln_new < ln_old:
              errs.append(f"ספר-הנראו איבד שורות: {ln_old} -> {ln_new}. אסור למחוק רשומות ישנות.")
          else:
              notes.append(f"ספר-נראו {ln_old} -> {ln_new}")

          ch_new, ch_old = chapters(new), chapters(old)
          if ch_new < ch_old:
              errs.append(f"ספירת הפרקים ירדה: {ch_old} -> {ch_new}")
          else:
              notes.append(f"פרקים {ch_old} -> {ch_new}")

          # גודל: ארכיון לגיטימי מקטין, קטיעה מוחקת. הגבול 20%.
          shrink = 1 - len(new) / len(old)
          if shrink > 0.20:
              errs.append(f"הקובץ התכווץ ב-{shrink:.1%} ({len(old):,} -> {len(new):,}) — מעבר לסביר גם לארכיון")
          else:
              notes.append(f"גודל {len(old):,} -> {len(new):,} ({-shrink:+.1%})")

          if errs:
              print("❌ ולידציה נכשלה:")
              for e in errs: print("  -", e)
              sys.exit(1)
          print("✅ ולידציה עברה — " + " · ".join(notes))
          PY

      - name: קומיט ודחיפה ל-main
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "אין שינוי בקובץ — מדלג על פריסה"
            exit 0
          fi
          git config user.name  "claude-guide-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "עדכון יומי אוטומטי — $(TZ=Asia/Jerusalem date '+%d/%m/%Y %H:%M')"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # ---------- פריסה ל-jmahery.com ----------
      # בטיחות: מעלים רק מתיקיית-ביניים, כך שהפעולה כלל לא "מכירה"
      # קבצים אחרים בשורש ולא יכולה למחוק אותם. guide.html לא נוגעים בו.
      # ═══════════════════════════════════════════════════════════
      #  פריסה ל-jmahery.com — לתת-דומיין בלבד, לעולם לא לשורש.
      #  שכבות הגנה: (1) חשבון FTP כלוא לתיקייה  (2) נעילת יעד בקוד
      #  (3) תיקיית-ביניים  (4) state ייחודי  (5) בדיקת-שפיות אחרי
      # ═══════════════════════════════════════════════════════════
      - name: בדיקה אם FTP מוגדר
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✅ FTP מוגדר — נפרוס לתת-הדומיין"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  FTP לא מוגדר — מדלגים (GitHub Pages מתעדכן כרגיל)"
          fi

      - name: 🔒 שער-בטיחות — רק החשבון הכלוא רשאי לפרוס
        if: steps.commit.outputs.changed == 'true' && steps.ftp.outputs.enabled == 'true'
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        run: |
          set -euo pipefail
          # ההגנה האמיתית היא ה-chroot בשרת. הבדיקה כאן מוודאת שלא הוחלף
          # בטעות לחשבון בעל גישה רחבה (admin/eyad/smhmd1 -> public_html).
          case "$FTP_USERNAME" in
            "${FTP_EXPECTED_USER_PREFIX}"*)
              echo "✅ משתמש: ${FTP_USERNAME%%@*}@… — החשבון הכלוא" ;;
            "")
              echo "❌ FTP_USERNAME ריק"; exit 1 ;;
            admin@*|eyad@*|smhmd1@*|*jmaheryc*)
              echo "❌ עצירה: '$FTP_USERNAME' הוא חשבון בעל גישה רחבה."
              echo "   חשבונות כאלה רואים את public_html, שם יושבים index.html"
              echo "   (מערכת הניהול) ו-guide.html (מדריך מרוקו)."
              echo "   פרוס רק עם ${FTP_EXPECTED_USER_PREFIX}…"
              exit 1 ;;
            *)
              echo "❌ עצירה: '$FTP_USERNAME' אינו החשבון הייעודי הצפוי."
              echo "   צפוי: ${FTP_EXPECTED_USER_PREFIX}…"
              exit 1 ;;
          esac
          echo "✅ היעד '$FTP_TARGET_DIR' = שורש הכלוב, לא שורש האתר"

      - name: הכנת תיקיית-ביניים
        if: steps.commit.outputs.changed == 'true' && steps.ftp.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          rm -rf _deploy && mkdir -p _deploy
          cp index.html _deploy/index.html
          cp index.html _deploy/claude-guide.html
          echo "מה שיעלה (ורק זה):"; ls -la _deploy/
          test "$(ls -1 _deploy | wc -l)" -eq 2 || { echo "❌ תיקיית-הביניים אינה בדיוק 2 קבצים"; exit 1; }

      - name: העלאה ב-FTPS לתת-הדומיין
        if: steps.commit.outputs.changed == 'true' && steps.ftp.outputs.enabled == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./_deploy/
          server-dir: ${{ env.FTP_TARGET_DIR }}
          state-name: .ftp-deploy-claude-guide-state.json
          dangerous-clean-slate: false
          timeout: 60000
          log-level: standard

      - name: 🛡️ בדיקת-שפיות — לוודא ששום דבר אחר לא נדרס
        if: steps.commit.outputs.changed == 'true' && steps.ftp.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          FAIL=0
          echo "— מערכת ניהול המשימות (jmahery.com) עדיין חיה?"
          if curl -fsSL --max-time 45 "https://jmahery.com/?c=$(date +%s)" | grep -q "ניהול משימות"; then
            echo "  ✅ המערכת במקומה"
          else
            echo "  🚨 מערכת הניהול לא מזוהה בשורש — בדוק מיד!"; FAIL=1
          fi
          echo "— מדריך מרוקו (guide.html) עדיין חי?"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "https://jmahery.com/guide.html?c=$(date +%s)")
          if [ "$CODE" = "200" ]; then echo "  ✅ מגיב 200"; else echo "  🚨 מחזיר $CODE"; FAIL=1; fi
          exit $FAIL

      - name: אימות שהגרסה החיה התעדכנה
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          echo "ממתין ל-GitHub Pages…"; sleep 90
          STAMP=$(date +%s)
          URLS="https://smhmd1-cyber.github.io/claude-guide/?nocache=$STAMP"
          if [ "${{ steps.ftp.outputs.enabled }}" = "true" ]; then
            URLS="$URLS https://${GUIDE_SUBDOMAIN}/?nocache=$STAMP"
          fi
          for url in $URLS; do
            echo "בודק $url"
            VER=$(curl -fsSL --max-time 45 "$url" | grep -o 'גרסה 2[0-9]\.[0-9]*' | head -1 || echo "לא נמצא")
            echo "  → $VER"
          done
