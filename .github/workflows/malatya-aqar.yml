name: وكيل العقارات — ملاطيا

# 04:10 UTC = 07:10 بتوقيت القدس (صيفاً) — قبل النشرة اليومية بساعتين.
#
# ═══════════════════════════════════════════════════════════════════
# لماذا تغيّر هذا السير في ٢٩/٠٨/٢٠٢٦
# ═══════════════════════════════════════════════════════════════════
# كان الوكيل يتصفّح البوّابات بنفسه ويكتب ملفّي البيانات. توقّف عن الإنتاج
# في ٢٥/٠٨: hepsiemlak و Coldwell Banker و sahibinden صارت تردّ 403 على أي
# عميل آليّ، فكان يعود بلا نتائج وتفشل بوّابة التحقّق بـ«سجلّات اليوم 0»
# كل يوم، وتجمّد `aqar-listings.json` أربعة أيام.
#
# البنية الآن على مرحلتين مفصولتين:
#   ١. `scripts/scrape_aqar.py` — سحب حتميّ من Emlakjet. هو وحده يكتب
#      `aqar-listings.json` و`aqar-reports.json`. لا نموذج لغوي في هذه المرحلة.
#   ٢. خطوة Claude — تقرأ ما جُمع محلّياً وتكتب التقرير السرديّ وحده
#      (`agents/src/aqar-${{ steps.d.outputs.today }}.md`). لا تلمس ملفّات البيانات ولا تجلب من الشبكة.
#      وهي `continue-on-error` قصداً: تعطّل التقرير السرديّ لا يجوز أن يمنع
#      تحديث البيانات — وهذا بالضبط ما حدث في الأيام الأربعة الماضية.
# ═══════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: "10 4 * * *"
  workflow_dispatch:
    inputs:
      skip_narrative:
        description: "تخطّي التقرير السرديّ والاكتفاء بتحديث البيانات"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: malatya-aqar
  cancel-in-progress: false

jobs:
  watch:
    name: مسح · تقييم · تحديث اللوحة
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت الاعتماديات
        run: python3 -m pip install --quiet requests certifi

      # مبحثٌ صغير يحرس قاطع الدائرة في مرحلة التفاصيل: أن يتوقّف بعد سلسلة
      # إخفاقات بدل أن يلتهم مهلة الوظيفة، وألّا يُسقط صفّاً واحداً وهو يتوقّف.
      # ثانيةٌ واحدة هنا تحمي ستّين دقيقة هناك.
      - name: مبحث قاطع الدائرة
        run: python3 tests/test_detail_breaker.py

      - name: سحب حتميّ — شقق ملاطيا بيعاً وإيجاراً
        run: python3 scripts/scrape_aqar.py

      # التاريخ يُحسب هنا مرّة واحدة ويُحقن في التوجيه جاهزاً. كان مكتوباً في
      # التوجيه حرفياً `aqar-TODAY.md` بوصفه «متغيّراً»، فكتب النموذج ملفاً بهذا
      # الاسم فعلاً (30 و31/08 و01/09/2026): لا صفحة أرشيف، وكل يوم يدهس سابقه.
      # ما لا يجب أن يستنتجه النموذج، لا يُترك له.
      - name: تاريخ اليوم
        id: d
        run: echo "today=$(TZ=Asia/Jerusalem date '+%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: تشغيل Claude — التقرير السرديّ من البيانات المجموعة
        if: ${{ inputs.skip_narrative != true }}
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            أنت **محلّل سوق الشقق في ملاطيا**. تعمل داخل GitHub Actions. لديك موافقة قائمة؛ لا تطرح أسئلة.

            ═══════════════════════════════
            ⚠️ **حدود عملك (تَجُبّ ما عداها)**
            ═══════════════════════════════
            البيانات **جُمعت قبلك** بسحّاب حتميّ. مهمّتك التحليل والكتابة، لا الجمع.
            - **لا تجلب من الشبكة إطلاقاً**: لا WebFetch ولا WebSearch ولا curl ولا بايثون للجلب.
              البوّابات تردّ 403 على العملاء الآليّين، وهذا سبب إعادة بناء هذا السير أصلاً.
            - **لا تكتب ولا تعدّل** `malatya/data/aqar-listings.json` ولا `malatya/data/aqar-reports.json`.
              يملكهما السحّاب وحده، وأي تعديل منك سيُدهس غداً وتفشل بوّابة التحقّق اليوم.
            - **الملفّ الوحيد الذي تكتبه**: `agents/src/aqar-${{ steps.d.outputs.today }}.md` (أنشئ المجلّد إن لزم).
            - **ممنوع الاختلاق**: كل رقم في تقريرك مأخوذ من الملفّين المقروءين. ما ليس فيهما = «غير معروف».
              لا تخترع اسم مكتب ولا رابطاً ولا رقم مادّة قانونية.
            - **ممنوع لغة الترويج**: لا «الربح مضمون» ولا «العائد مؤكَّد» ولا «فرصة لا تُعوَّض».
              وصفٌ للأرقام لا دعوةٌ للشراء.

            ═══════════════════════════════
            **الخطوة ١ — اقرأ**
            ═══════════════════════════════
            تاريخ اليوم هو **${{ steps.d.outputs.today }}** — استعمله كما هو ولا تستنتجه.
            اقرأ `malatya/data/aqar-listings.json`. بنيته:
            `updated · total · sources[] · summary{} · stats[] (لكل إلچة) · age_stats[] (لكل فئة عمر) · items[]`
            وكل عنصر في `items[]` يحمل:
            `deal (sale|rent) · ilce · mah · rooms · m2 · m2net · p · ppm · age · age_raw · agesrc ·
             fresh · tapu · floor · floors · isitma · otopark · krediye · site · asansor · kira ·
             yield_ · score · rec · first_seen · last_seen · new_today · d (تاريخ النشر) · u (الرابط)`
            واقرأ `malatya/data/aqar-reports.json` — سلسلة السجلّات اليومية — لمقارنة اليوم بالأمس.

            ═══════════════════════════════
            **الخطوة ٢ — اكتب `agents/src/aqar-${{ steps.d.outputs.today }}.md`**
            ═══════════════════════════════
            ماركداون بالعربية، بهذه الأقسام:

            **١. لقطة السوق** — عدد المعروض بيعاً وإيجاراً، وسيط ₺/م² للبيع وللإيجار، العائد الإجمالي،
            وكم إعلاناً ظهر اليوم لأول مرّة (`summary.new_today`). قارن بسجلّ الأمس إن وُجد وقل مقدار التغيّر.

            **٢. عمر البناء** — جدول من `age_stats`. اذكر صراحةً أنّ القيمة منقولة عن حقل «Bina Yaşı»
            المعلَن في الإعلان لا مستنبَطة، وأنّ زلزال ٦ شباط ٢٠٢٣ يجعل سنة البناء ومطابقة لائحة
            الزلازل سؤالاً جوهرياً في ملاطيا لا يجيب عنه إعلان.

            **٣. الإلچات** — جدول من `stats`: عدد البيع والإيجار، وسيط ₺/م² لكلٍّ، والعائد حيث وُجد الطرفان.
            علّق على الإلچات التي لا عائد لها: نقص طرف لا نقص جدوى.

            **٤. عشرة إعلانات تستحقّ النظر** — رتّب `items` (بيعاً فقط) بـ`score` تنازلياً وخذ العشرة الأولى.
            لكل واحد: الحيّ، الغرف، المساحة، السعر، ₺/م²، عمر البناء، نوع الطابو، رابط الإعلان،
            ورابط خرائط جوجل بالاسم التركي للحيّ. وانسخ `rec` كما هو — هو نصّ مشتقّ من الحقول لا رأي.
            **اشرح في سطر واحد كيف حُسبت `score`** وأنها ترتيب قراءة لا توصية شراء.

            **٥. أعلام تستوجب الحذر** — أَبرِز: الطابو المشاع (`hisseli`) وما بلا قيد طابو،
            و«غير صالح للتمويل»، والإعلانات التي سعر مترها يشذّ عن وسيط إلچته بأكثر من ٥٠٪ صعوداً أو هبوطاً.

            **٦. المنهجية والقيود** — المصدر Emlakjet وحده (اذكر `sources[].site_reported_total` مقابل `count`).
            واذكر صراحةً أنّ sahibinden و hepsiemlak و hürriyetemlak و Coldwell Banker محجوبة عن العملاء
            الآليّين فلا تدخل هذه اللوحة، وأنّ ما يُعرض عبر مكاتب محلّية دون نشر لا يظهر على أي منصّة.
            واذكر عدد الإعلانات التي تعذّر جلب صفحة تفاصيلها (`sources` → المفتاح `_detail`).

            **٧. تنويه** — هذا رصد سوق لا نصيحة استثمارية، والوثيقة المُلزِمة هي قيد الطابو
            ورخصة الإسكان (İskân) من بلدية الإلچة.

            **بيانات ناقصة؟** ضعها في جدول «بيانات مطلوبة من المستثمر» في نهاية التقرير.
            **لا تُنهِ التقرير بسؤال.**

            ═══════════════════════════════
            **الخطوة ٣ — فحص ذاتي**
            ═══════════════════════════════
            - `git status --short` لا يُظهر تعديلاً على أي ملفّ داخل `malatya/data/`
            - الملفّ الوحيد الجديد هو `agents/src/aqar-${{ steps.d.outputs.today }}.md`
            - كل رابط في التقرير يبدأ بـ https ومأخوذ من `items[].u`

            **تقرير ختامي بالعربية:** ماذا كتبت، وأبرز ثلاثة أرقام، وما لم تجده في البيانات.
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git status:*),Bash(date:*),Bash(mkdir:*),Bash(python3 -c:*)"
            --permission-mode acceptEdits

      - name: توليد صفحة التقرير وتحديث الفهرس
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 .github/scripts/build_report.py aqar

      - name: التحقّق — لا ننشر بيانات معطوبة
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, sys, os
          errs, notes = [], []
          TODAY = subprocess.run(['date','+%Y-%m-%d'],capture_output=True,text=True,
                                 env={**os.environ,'TZ':'Asia/Jerusalem'}).stdout.strip()
          UTC = subprocess.run(['date','-u','+%Y-%m-%d'],capture_output=True,text=True).stdout.strip()

          def old(path):
              r = subprocess.run(['git','show','HEAD:'+path],capture_output=True,text=True)
              try:
                  return json.loads(r.stdout) if r.returncode==0 and r.stdout.strip() else None
              except Exception:
                  return None

          AGES = ['صفر · جاهز للسكن','قيد الإنشاء','١–٣ سنوات','٤–٥ سنوات',
                  '٦–١٠ سنوات','أكثر من ١٠ سنوات','غير مذكور']
          DISTRICTS = ['Battalgazi','Yeşilyurt','Akçadağ','Arapgir','Arguvan','Darende',
                       'Doğanşehir','Doğanyol','Hekimhan','Kale','Kuluncak','Pütürge',
                       'Yazıhan','Merkez']

          d = json.load(open('malatya/data/aqar-listings.json',encoding='utf-8'))
          if not isinstance(d,dict) or not isinstance(d.get('items'),list):
              print('❌ aqar-listings.json ليس وثيقة بالبنية المتوقَّعة'); sys.exit(1)
          items = d['items']

          # ١. البنية والاتّساق الداخلي
          if d.get('total') != len(items):
              errs.append('العدّاد total (%s) لا يطابق عدد العناصر (%d)' % (d.get('total'), len(items)))
          if d.get('updated') not in (TODAY, UTC):
              errs.append('تاريخ الملف %s ليس اليوم (%s / %s)' % (d.get('updated'), TODAY, UTC))

          ids = [(r.get('src'), r.get('id')) for r in items]
          if len(set(ids)) != len(ids):
              errs.append('تكرار في المعرّفات: %d عنصراً و%d معرّفاً فريداً' % (len(ids), len(set(ids))))

          # ٢. عدّادات المصادر تُطابق ما في الملف فعلاً
          for s in d.get('sources',[]):
              if s.get('key','').startswith('emlakjet-'):
                  deal = s['key'].split('-',1)[1]
                  n = len([r for r in items if r.get('deal')==deal])
                  if s.get('count') != n:
                      errs.append('عدّاد المصدر %s (%s) لا يطابق العناصر (%d)' % (s['key'], s.get('count'), n))

          # ٣. القيم داخل المجالات المسموحة
          bad_age = sorted({r.get('age') for r in items if r.get('age') not in AGES})
          if bad_age: errs.append('فئات عمر خارج القائمة: %s' % bad_age[:4])
          bad_d = sorted({r.get('ilce') for r in items if r.get('ilce') not in DISTRICTS})
          if bad_d: errs.append('إلچات خارج ولاية ملاطيا: %s' % bad_d[:4])
          bad_deal = sorted({r.get('deal') for r in items if r.get('deal') not in ('sale','rent')})
          if bad_deal: errs.append('قيم deal غير معروفة: %s' % bad_deal[:4])
          bad_u = [r.get('id') for r in items if not str(r.get('u','')).startswith('https://')]
          if bad_u: errs.append('روابط غير آمنة: %d إعلاناً' % len(bad_u))

          # ٤. الإحصاءات تُطابق العناصر
          by_age = (d.get('summary') or {}).get('by_age') or {}
          for a in AGES:
              n = len([r for r in items if r.get('age')==a])
              if by_age.get(a,0) != n:
                  errs.append('by_age[%s]=%s والعناصر %d' % (a, by_age.get(a), n))
          if not d.get('age_stats'): errs.append('age_stats غائب')
          if not d.get('stats'): errs.append('stats غائب')

          import statistics
          pp = sorted(r['ppm'] for r in items if r.get('ppm') and r.get('deal')=='sale')
          want = int(statistics.median(pp)) if pp else None
          got = (d.get('summary') or {}).get('ppm_median')
          if want != got: errs.append('ppm_median المعلن %s والمحسوب %s' % (got, want))

          # ٥. لا انكماش صامت
          o = old('malatya/data/aqar-listings.json')
          if isinstance(o,dict) and isinstance(o.get('items'),list):
              if len(items) < len(o['items'])*0.6:
                  errs.append('انكماش حادّ: %d → %d' % (len(o['items']), len(items)))
          notes.append('%d إعلاناً (%s بيع · %s إيجار)' % (
              len(items), (d['summary'] or {}).get('n_sale'), (d['summary'] or {}).get('n_rent')))

          # ٦. سجلّ اليوم في السلسلة
          rep = json.load(open('malatya/data/aqar-reports.json',encoding='utf-8'))
          if not isinstance(rep,list):
              errs.append('aqar-reports.json ليس مصفوفة')
          else:
              rows = [r for r in rep if r.get('date') in (TODAY, UTC)]
              if len(rows) != 1:
                  errs.append('سجلّات اليوم %d (المطلوب ١)' % len(rows))
              else:
                  t = rows[0]
                  for k in ('n_sale','n_rent','med_ppm','top'):
                      if k not in t: errs.append('حقل ناقص في سجلّ اليوم: %s' % k)
                  if not isinstance(t.get('hi'),(int,float)) or t.get('hi',0) > 10000:
                      errs.append('hi يجب أن يكون عدداً صغيراً (القيمة: %s)' % t.get('hi'))
                  for x in t.get('top',[]):
                      if not str(x.get('url','')).startswith('https://'):
                          errs.append('رابط غير صالح في top: %s' % str(x.get('url'))[:50])
                  notes.append('سجلّ اليوم: بيع %s · إيجار %s · أفضل %d'
                               % (t.get('n_sale'), t.get('n_rent'), len(t.get('top',[]))))

          # ٦ب. مصدرٌ سقط ⇐ الملفّ يحمل بيانات الأمس تحت تاريخ اليوم.
          # هذا ليس عطلاً في الملفّ فلا يُوقف النشر — لكنّه لا يمرّ صامتاً أبداً:
          # صمتُ الأمس هو ما جمّد اللوحة أربعة أيام في آب/أغسطس 2026.
          bad_src = [s for s in d.get('sources', [])
                     if s.get('key', '').startswith('emlakjet-') and s.get('status') != 'ok']
          if bad_src:
              names = ', '.join(s.get('key') for s in bad_src)
              print('::warning::مصادر لم تُسحب اليوم (%s) — المعروض منها بيانات آخر سحب ناجح' % names)
              notes.append('⚠️ مصادر متعثّرة: %s' % names)
              # يومان متتاليان على المصدر نفسه لم تعودا تحذيراً: تلك بياناتٌ ميتة.
              prev = old('malatya/data/aqar-listings.json') or {}
              prev_bad = {s.get('key') for s in (prev.get('sources') or [])
                          if s.get('status') not in (None, 'ok')}
              still = [s.get('key') for s in bad_src if s.get('key') in prev_bad]
              if still:
                  errs.append('المصدر %s ساقط لليوم الثاني على التوالي — لا نُثبّت بيانات ميتة'
                              % ', '.join(still))

          # ٦ج. صفحة أرشيف اليوم — تُبنى في الخطوة السابقة، وهنا نتأكّد أنّها هناك.
          want = 'aqar-%s.html' % TODAY
          if not os.path.exists('malatya/reports/' + want):
              print('::warning::لا صفحة أرشيف ليوم %s — راجع خطوة بناء التقرير' % TODAY)
          else:
              notes.append('صفحة اليوم %s' % want)

          # ٧. الفهرس لا يشير إلى تقرير غير موجود
          try:
              idx = json.load(open('malatya/data/reports-index.json',encoding='utf-8'))
              miss = [r['file'] for r in idx if not os.path.exists('malatya/reports/'+r['file'])]
              if miss: errs.append('تقارير مفقودة: %s' % miss[:3])
              else: notes.append('الفهرس %d تقريراً' % len(idx))
          except FileNotFoundError:
              notes.append('لا فهرس تقارير')

          if errs:
              print('❌ فشل التحقّق:')
              for e in errs: print('  -', e)
              sys.exit(1)
          print('✅ نجح التحقّق — ' + ' · '.join(notes))
          PY

      - name: حارس النطاق — لا نلمس ما ليس لنا
        run: |
          set -euo pipefail
          # السحّاب والوكيل معاً لا يملكان إلّا هذه المسارات. أي تعديل خارجها
          # حادثٌ لا نيّة، ويُوقَف قبل أن يصل إلى main.
          BAD=$(git status --porcelain \
                | awk '{print $2}' \
                | grep -Ev '^(malatya/data/aqar-|malatya/reports/aqar-|malatya/data/reports-index\.json|agents/src/aqar-)' \
                || true)
          if [ -n "$BAD" ]; then
            echo "❌ تعديل خارج نطاق وكيل العقارات:"; echo "$BAD"; exit 1
          fi
          echo "✅ كل التعديلات داخل نطاق الوكيل"

      - name: Commit ودفع إلى main
        id: commit
        run: |
          set -euo pipefail
          echo "pushed=false" >> "$GITHUB_OUTPUT"

          git add -A malatya/data malatya/reports agents/src
          if git diff --cached --quiet; then
            echo "لا تغيير — لا commit"; exit 0
          fi
          git config user.name  "malatya-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "وكيل العقارات — $(TZ=Asia/Jerusalem date '+%Y-%m-%d %H:%M')"
          # ═══════════════════════════════════════════════════════════
          # دفعٌ مقاوم للتسابق. خمسة سيور عمل تدفع إلى main (النشرة ·
          # الأراضي · العقارات · الاستثمار · دليل Claude)، وكلٌّ منها قد
          # يعمل حتى ٤٥ دقيقة، وجدولة GitHub تتأخّر ساعةً أحياناً — في
          # 26/08/2026 انطلقت النشرة 07:05 بدل 06:10 فلامست موعد الاستثمار.
          # عند التداخل يُرفض دفع الثاني (non-fast-forward)، ومع set -e
          # تموت الريّة وتضيع ساعة عمل كاملة. لذلك: أعِد الأساس وأعِد المحاولة.
          # ═══════════════════════════════════════════════════════════
          for i in 1 2 3 4 5; do
            if git push; then echo "✅ دُفع إلى main (محاولة $i)"; break; fi
            if [ "$i" = "5" ]; then
              echo "❌ تعذّر الدفع بعد خمس محاولات — main يتغيّر أسرع من قدرتنا"; exit 1
            fi
            echo "↻ main تقدّم أثناء عملنا — أُعيد الأساس وأحاول ثانيةً (محاولة $i)"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort 2>/dev/null || true
              echo "❌ تعارض حقيقي أثناء إعادة الأساس — يحتاج يداً بشرية، ولن نفرض شيئاً"
              exit 1
            fi
            sleep $((i * 5))
          done
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "✅ دُفع — سيُستدعى «نشر منظومة ملاطيا» الآن"

  publish:
    name: نشر إلى jmahery.com
    needs: watch
    if: needs.watch.outputs.pushed == 'true'
    uses: ./.github/workflows/malatya-publish.yml
    secrets: inherit
