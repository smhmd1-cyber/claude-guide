name: ملاطيا — أراضي البناء (يومي)

on:
  schedule:
    - cron: '25 5 * * *'      # 08:25 بتوقيت القدس صيفاً — بعد وكيل الأراضي مباشرةً
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'مسح أرشيف ilan.gov.tr كاملاً (بطيء — مرّة واحدة عند التأسيس)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: malatya-arsa
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: تثبيت المتطلّبات
        run: pip install --quiet requests

      - name: سحب إعلانات الأرض في ولاية ملاطيا
        run: python scripts/scrape_arsa.py
        env:
          ARSA_OUT: malatya/data/arsa-listings.json
          ILAN_FULL_SCAN: ${{ inputs.full_scan && '1' || '' }}

      - name: التحقّق من سلامة الملف
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open('malatya/data/arsa-listings.json', encoding='utf-8'))
          E = []
          if d.get('province') != 'Malatya':
              E.append('province ليست Malatya')
          items = d.get('items') or []
          if len(items) < 30:
              E.append('عدد الإعلانات %d — أقل من الحدّ الأدنى المعقول (30)' % len(items))
          if d.get('total') != len(items):
              E.append('total لا يساوي عدد العناصر')

          # «Merkez» تسمية ما قبل ٢٠١٣ ما زالت الدوائر الرسمية تستعملها لمركز ملاطيا،
          # فتُقبل كسلّة صريحة لا تُنسب إلى إلچة بعينها.
          DIST = {"Battalgazi","Yeşilyurt","Akçadağ","Arapgir","Arguvan","Darende","Doğanşehir",
                  "Doğanyol","Hekimhan","Kale","Kuluncak","Pütürge","Yazıhan","Merkez"}
          keys = set()
          for r in items:
              k = (r.get('src') or 'emlakjet', r.get('id'))
              if k in keys:
                  E.append('معرّف مكرّر داخل المصدر: %s/%s' % k)
              keys.add(k)
              for f in ('id', 't', 'ilce', 'u'):
                  if not r.get(f):
                      E.append('حقل %s ناقص في %s/%s' % (f, k[0], k[1])); break
              if not str(r.get('u','')).startswith('https://'):
                  E.append('رابط غير https في %s/%s' % k)
              if r.get('ilce') not in DIST:
                  E.append('إلچة خارج ولاية ملاطيا: %r في %s/%s' % (r.get('ilce'), k[0], k[1]))
              if r.get('ppm') is not None and r.get('src') == 'ilangovtr' and r.get('ppm') <= 0:
                  E.append('₺/م² غير صالح في %s/%s' % k)

          srcs = d.get('sources') or []
          if not srcs:
              E.append('لا توجد قائمة مصادر')
          if all(s.get('status') == 'failed' for s in srcs):
              E.append('كل المصادر فشلت')
          for s in srcs:
              n = len([r for r in items if (r.get('src') or 'emlakjet') == s.get('key')])
              if s.get('count') != n:
                  E.append('عدّاد المصدر %s (%s) لا يطابق العناصر (%d)' % (s.get('key'), s.get('count'), n))

          # وسيط ₺/م² يجب أن يُحتسب من السوق وحده
          mk = sorted(r['ppm'] for r in items if r.get('ppm') and (r.get('src') or 'emlakjet') == 'emlakjet')
          if mk:
              import statistics
              exp = int(statistics.median(mk))
              if d['summary'].get('ppm_median') != exp:
                  E.append('ppm_median %s ≠ الوسيط المعاد حسابه %d' % (d['summary'].get('ppm_median'), exp))

          if E:
              print('\n'.join('✗ ' + e for e in E[:25]))
              sys.exit(1)
          print('✓ %d إعلاناً · %s · %d إلچة فيها إعلانات'
                % (len(items), d['summary'].get('by_source'), d['summary']['districts_with_listings']))
          for s in srcs:
              print('   %-12s %-7s %d' % (s.get('key'), s.get('status'), s.get('count')))
          PY

      - name: حصر التعديلات في ملف البيانات وحده
        run: |
          CHANGED=$(git status --porcelain | awk '{print $2}')
          echo "$CHANGED"
          for f in $CHANGED; do
            case "$f" in
              malatya/data/arsa-listings.json) ;;
              *) echo "✗ تعديل خارج النطاق المسموح: $f"; exit 1 ;;
            esac
          done

      - name: حفظ ودفع
        id: commit
        run: |
          git config user.name  "malatya-arsa-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- malatya/data/arsa-listings.json; then
            echo "لا تغيير في البيانات اليوم."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add malatya/data/arsa-listings.json
          git commit -m "أراضي البناء — تحديث $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git fetch origin main && git rebase origin/main && git push origin HEAD:main && break
            echo "محاولة الدفع $i فشلت — إعادة المحاولة"; sleep 6
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    uses: ./.github/workflows/malatya-publish.yml
    secrets: inherit
