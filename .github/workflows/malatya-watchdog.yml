name: حارس منظومة ملاطيا (إصلاح ذاتي)

# جدولة GitHub «أفضل جهد» لا ضمان: قد تتأخّر ساعات أو تُسقَط ريّة كاملة،
# وقد تفشل الريّة لأي سبب. هذا الحارس يفحص أربع مرّات يومياً، ويعيد
# التشغيل بنفسه (عبر workflow_call — بلا PAT وبلا تدخّل بشري)،
# وفي آخر موعد إن بقي الخلل يفتح بلاغاً فيصلك بريد من GitHub.
on:
  schedule:
    - cron: "45 6 * * *"    # 09:45 بتوقيت القدس (صيفاً) — بعد الموعد الأصلي بنصف ساعة
    - cron: "0 9 * * *"     # 12:00
    - cron: "0 12 * * *"    # 15:00
    - cron: "0 15 * * *"    # 18:00 — آخر محاولة، وبعدها بلاغ
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: malatya-watchdog
  cancel-in-progress: false

jobs:
  check:
    name: فحص المواضع الثلاثة
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      need_daily:  ${{ steps.probe.outputs.need_daily }}
      need_deploy: ${{ steps.probe.outputs.need_deploy }}
      escalate:    ${{ steps.probe.outputs.escalate }}
      summary:     ${{ steps.probe.outputs.summary }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🔎 فحص المستودع والمرآة والموقع الحيّ
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          T=$(date +%s)
          TODAY=$(TZ=Asia/Jerusalem date +%F)
          HM=$(TZ=Asia/Jerusalem date +%H%M)
          F=malatya/daleel.html

          # ── تاريخ المستودع: status.json إن وُجد، وإلّا آخر commit مسّ ملف النشرة
          REPO_DATE=$(python3 -c "import json;print(json.load(open('malatya/status.json')).get('date',''))" 2>/dev/null || echo "")
          if [ -z "$REPO_DATE" ]; then
            C=$(git log -1 --format=%cI -- "$F" 2>/dev/null || echo "")
            [ -n "$C" ] && REPO_DATE=$(TZ=Asia/Jerusalem date -d "$C" +%F 2>/dev/null || echo "")
            echo "ℹ️ لا status.json بعد — اعتمدت تاريخ آخر commit: ${REPO_DATE:-?}"
          fi
          # ── نشرة عقيمة: تاريخ اليوم على الملف وبطاقة واحدة لم تُكتب.
          # عطل 26/08/2026: الوكيل استدعى ScheduleWakeup وانتظر إشعارات لا تأتي
          # في ريّة دفعة واحدة، فتقدّم الختم والمحتوى ميّت. التاريخ وحده لم يعد
          # دليل صحّة — نقرأ الراية sterile وعدد البطاقات المكتوبة كذلك.
          REPO_STERILE=$(python3 -c "import json;d=json.load(open('malatya/status.json'));print('true' if d.get('sterile') else 'false')" 2>/dev/null || echo "unknown")
          REPO_WRITTEN=$(python3 -c "import json;print(json.load(open('malatya/status.json')).get('cards_written','?'))" 2>/dev/null || echo "?")
          REPO_ITEMS=$(grep -c '<div class="item"' "$F" 2>/dev/null || echo 0)
          # ⚠️ grep -m1 لا | head -1: مع pipefail يُغلق head الأنبوب فيموت grep
          # بـSIGPIPE فتعود القيمة فارغة ويبدو الموقع السليم منحرفاً.
          REPO_STAMP=$(grep -m1 -o 'id="daily-date"[^>]*>[^<]*' "$F" 2>/dev/null | sed 's/.*>//' || echo "")

          # ── الموقع الحيّ — ننزّل إلى ملف ثم نقرأ، بلا أنابيب من curl.
          # منذ 31/08/2026 صار /malatya/ محميّاً بكلمة مرور (cPanel Directory
          # Privacy)، فلم يعد الحارس يقرأ محتواه من الخارج. 401 هنا **دليل صحّة**:
          # الخادم يردّ والحماية قائمة. والخطر ليس في العمى بل في تفسيره: لو قُرئ
          # الصمت على أنّه انحراف مرآة لطلب الحارس إعادة نشر كل ساعة بلا سبب،
          # ولصعّد كل ساعة على عطل لا وجود له.
          LIVE_PROTECTED=no
          LIVE_DATE=""
          SC=$(curl -s -o /tmp/live.json -w "%{http_code}" --max-time 30 "https://jmahery.com/malatya/status.json?n=$T" 2>/dev/null || echo "000")
          if [ "$SC" = "200" ]; then
            LIVE_DATE=$(python3 -c "import json;print(json.load(open('/tmp/live.json')).get('date',''))" 2>/dev/null || echo "")
          elif [ "$SC" = "401" ]; then
            LIVE_PROTECTED=yes
          fi

          LIVE_STAMP=""
          DC=$(curl -s -o /tmp/live.html -w "%{http_code}" --max-time 30 "https://jmahery.com/malatya/daleel.html?n=$T" 2>/dev/null || echo "000")
          if [ "$DC" = "200" ]; then
            LIVE_STAMP=$(grep -m1 -o 'id="daily-date"[^>]*>[^<]*' /tmp/live.html | sed 's/.*>//' || echo "")
          elif [ "$DC" = "401" ]; then
            LIVE_PROTECTED=yes
          fi

          HUB_OK=no
          HC=$(curl -s -o /tmp/hub.html -w "%{http_code}" --max-time 30 "https://jmahery.com/malatya/?n=$T" 2>/dev/null || echo "000")
          if [ "$HC" = "200" ]; then
            grep -q "منظومة ملاطيا" /tmp/hub.html && HUB_OK=yes
          elif [ "$HC" = "401" ]; then
            HUB_OK=yes
            LIVE_PROTECTED=yes
            echo "🔒 /malatya/ محميّ بكلمة مرور — الخادم يردّ 401، وهذه صحّة لا عطل"
          fi

          echo "اليوم=$TODAY الساعة=$HM"
          echo "المستودع: تاريخ=$REPO_DATE بطاقات=$REPO_ITEMS ختم=$REPO_STAMP"
          echo "الحيّ:     تاريخ=${LIVE_DATE:-—} ختم=$LIVE_STAMP"
          echo "مركز التحكّم=$HUB_OK"

          NEED_DAILY=false
          NEED_DEPLOY=false
          STERILE=false
          [ "$REPO_DATE" != "$TODAY" ] && NEED_DAILY=true

          # نشرة اليوم موجودة لكنّها عقيمة: نمنح **إعادة تشغيل واحدة فقط**
          # عند نبضة الظهر. لا نعيدها في كل نبضة — الأربع محاولات مجتمعةً
          # تحرق حصّة الاشتراك بلا طائل إن كانت العلّة في الوكيل لا في الحظّ.
          if [ "$NEED_DAILY" = "false" ] && [ "$REPO_STERILE" = "true" ]; then
            STERILE=true
            if [ "$HM" -ge 1100 ] 2>/dev/null && [ "$HM" -lt 1300 ] 2>/dev/null; then
              NEED_DAILY=true
              echo "🌱 نشرة عقيمة (بطاقات مكتوبة=$REPO_WRITTEN) — محاولة واحدة عند الظهر"
            else
              echo "🌱 نشرة عقيمة (بطاقات مكتوبة=$REPO_WRITTEN) — خارج نافذة الإعادة الوحيدة"
            fi
          fi

          # ريّة يومية جارية أو في الطابور؟ لا نطلب ثانية — الأولى لم تنتهِ بعد.
          if [ "$NEED_DAILY" = "true" ]; then
            BUSY=$(gh run list --workflow malatya-daily.yml --limit 5 \
                   --json status --jq '[.[]|select(.status=="in_progress" or .status=="queued")]|length' 2>/dev/null || echo 0)
            if [ "${BUSY:-0}" != "0" ]; then
              NEED_DAILY=false
              echo "⏳ ريّة يومية جارية بالفعل ($BUSY) — نتخطّى الطلب الثاني"
            fi
          fi

          # انحراف المرآة: المستودع محدَّث والموقع الحيّ يحمل ختماً مختلفاً
          if [ "$NEED_DAILY" = "false" ]; then
            if [ "$LIVE_PROTECTED" = "yes" ]; then
              # لا نرى المحتوى، فلا ندّعي معرفةً به في الاتجاهين: لا «سليم» ولا
              # «منحرف». بوّابة النشر في malatya-publish.yml هي التي تتحقّق من
              # وصول الحزمة، ولها وصولٌ لا يمرّ عبر الويب.
              echo "🔒 المرآة غير مقروءة من الخارج بعد الحماية — لا انحراف يُستنتج ولا نشر يُطلب"
            elif [ -n "$LIVE_DATE" ]; then
              [ "$LIVE_DATE" != "$TODAY" ] && NEED_DEPLOY=true
            elif [ -n "$LIVE_STAMP" ] && [ "$LIVE_STAMP" != "$REPO_STAMP" ]; then
              NEED_DEPLOY=true
            elif [ -z "$LIVE_STAMP" ]; then
              NEED_DEPLOY=true
            fi
          fi

          ESCALATE=false
          if [ "$HM" -ge 1700 ] && { [ "$NEED_DAILY" = "true" ] || [ "$NEED_DEPLOY" = "true" ]; }; then ESCALATE=true; fi
          [ "$HUB_OK" != "yes" ] && ESCALATE=true
          # فقدان أرشيف: أخطر من تأخّر يوم — تصعيد فوري في أي ساعة
          if [ "$REPO_ITEMS" -lt 10 ] || [ "$REPO_ITEMS" -gt 900 ]; then ESCALATE=true; fi
          # نشرة عقيمة صمدت حتى آخر نبضة ⇒ بلاغ. تاريخٌ يتقدّم بمحتوى ميّت
          # لا يصرخ من تلقاء نفسه، وهذا بالضبط ما يجعله أخطر من عطل صريح.
          if [ "$STERILE" = "true" ] && [ "$HM" -ge 1700 ]; then ESCALATE=true; fi

          SUM="اليوم $TODAY · المستودع ${REPO_DATE:-تعذّرت القراءة} · الحيّ ${LIVE_DATE:-${LIVE_STAMP:-تعذّرت القراءة}} · بطاقات $REPO_ITEMS · مكتوبة اليوم ${REPO_WRITTEN} · عقيمة $STERILE · مركز التحكّم $HUB_OK"

          {
            echo "need_daily=$NEED_DAILY"
            echo "need_deploy=$NEED_DEPLOY"
            echo "escalate=$ESCALATE"
            echo "summary=$SUM"
          } >> "$GITHUB_OUTPUT"

          if [ "$NEED_DAILY" = "false" ] && [ "$NEED_DEPLOY" = "false" ] && [ "$HUB_OK" = "yes" ] && [ "$STERILE" != "true" ]; then
            echo "✅ كل شيء سليم — لا إجراء"
          elif [ "$STERILE" = "true" ] && [ "$NEED_DAILY" = "false" ] && [ "$NEED_DEPLOY" = "false" ]; then
            echo "🌱 النشرة منشورة ومتقدّمة، لكنّها عقيمة — لا إجراء الآن، والبلاغ عند 18:00"
          else
            echo "⚠️ سنتدخّل: need_daily=$NEED_DAILY need_deploy=$NEED_DEPLOY"
          fi

  # إعادة تشغيل النشرة كاملةً — نفس الملف، لا نسخة ثانية تتعفّن
  heal_daily:
    name: إصلاح — إعادة تشغيل النشرة
    needs: check
    if: needs.check.outputs.need_daily == 'true'
    uses: ./.github/workflows/malatya-daily.yml
    secrets: inherit

  # المستودع متقدّم والموقع متأخّر ⇐ إعادة نشر فقط
  heal_deploy:
    name: إصلاح — إعادة النشر (malatya-publish)
    needs: check
    if: needs.check.outputs.need_deploy == 'true'
    uses: ./.github/workflows/malatya-publish.yml
    secrets: inherit

  escalate:
    name: تصعيد — بلاغ إلى صاحب المستودع
    needs: [check, heal_daily, heal_deploy]
    if: >-
      always() && (
        needs.check.outputs.escalate == 'true' ||
        needs.heal_daily.result == 'failure' ||
        needs.heal_deploy.result == 'failure'
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 🚨 فتح/تحديث البلاغ
        env:
          GH_TOKEN: ${{ github.token }}
          # ⚠️ إلزامي: لا checkout في هذه الوظيفة، فلا سياق مستودع لـgh.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          D=$(TZ=Asia/Jerusalem date +%F)
          TITLE="🚨 نشرة ملاطيا لم تتقدّم — $D"
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="الحارس حاول الإصلاح ولم ينجح.

          الحالة: ${{ needs.check.outputs.summary }}
          إصلاح النشرة: ${{ needs.heal_daily.result }}
          إصلاح النشر:  ${{ needs.heal_deploy.result }}
          سجلّ الريّة: $URL

          ما يستحقّ الفحص أوّلاً:
          1. الفحص القبلي في سجلّ «النشرة اليومية» — هل تغيّر اسم ملف أو مسار؟
          2. صلاحية \`CLAUDE_CODE_OAUTH_TOKEN\`.
          3. أسرار FTP: \`FTP_SERVER\` · \`FTP_MALATYA_USERNAME\` · \`FTP_MALATYA_PASSWORD\`."
          NUM=$(gh issue list --state open --limit 50 --json number,title \
                --jq "[.[] | select(.title==\"$TITLE\") | .number] | first // empty" || echo "")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
