name: النشرة اليومية — بوابة ملاطيا

# 06:10 UTC = 09:10 بتوقيت القدس (صيفاً) / 08:10 (شتاءً).
# workflow_call: يسمح للحارس (malatya-watchdog.yml) بإعادة تشغيل هذا الملف
# ذاتياً دون PAT ودون تدخّل بشري.
on:
  schedule:
    - cron: "10 6 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: malatya-daily
  cancel-in-progress: false

env:
  # ⛔ مصدر الحقيقة الوحيد لمسارات الملفات. لا تكتب مساراً حرفياً في أي خطوة.
  # سبب عطل 25/08/2026: كان المسار مكتوباً حرفياً index.html في ١٤ موضعاً،
  # وحين أُعيدت التسمية إلى daleel.html بقي سير العمل يحرّر الملف الخطأ.
  DAILY_FILE: malatya/daleel.html
  HUB_FILE: malatya/index.html
  HUB_MARK: منظومة ملاطيا

jobs:
  update:
    name: رصد · تحرير · نشر
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ═══════════════════════════════════════════════════════════
      # فحص قبلي: يوقف الريّة في الثانية الأولى إن تغيّرت البنية،
      # بدل أن تفشل بصمت بعد ٤٠ دقيقة كما حدث في 25/08/2026.
      # ═══════════════════════════════════════════════════════════
      - name: 🧪 فحص قبلي — هل البنية كما نتوقّعها؟
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys, re, datetime

          def bad_dates(text):
              """تواريخ تعبر الـregex لكنّها مستحيلة تقويمياً: 2026-13-45 · 2026-02-30."""
              out = []
              for v in re.findall(r'data-date="([^"]*)"', text):
                  try:
                      datetime.date.fromisoformat(v)
                  except ValueError:
                      out.append(v)
              return sorted(set(out))

          d = os.environ['DAILY_FILE']; h = os.environ['HUB_FILE']; mark = os.environ['HUB_MARK']
          errs = []
          if not os.path.exists(d):
              errs.append("ملف النشرة %s غير موجود — هل أُعيدت تسميته؟ صحّح DAILY_FILE في رأس سير العمل." % d)
          if not os.path.exists(h):
              errs.append("مركز التحكّم %s غير موجود." % h)
          if os.path.exists(d):
              t = open(d, encoding='utf-8').read()
              for m in ('DAILY-CONTENT-START', 'DAILY-CONTENT-END'):
                  if t.count(m) != 1:
                      errs.append("%s: العلامة %s ظهرت %d مرّة (المطلوب ١)" % (d, m, t.count(m)))
              if t.count('id="daily-date"') != 1:
                  errs.append('%s: id="daily-date" ظهر %d مرّة (المطلوب ١)' % (d, t.count('id="daily-date"')))
              if t.count('class="item"') < 10:
                  errs.append("%s: البطاقات %d فقط — الأرشيف يبدو مفقوداً" % (d, t.count('class="item"')))
              # ⚠️ لغم 26/08/2026: تاريخ مثل 2026-13-45 يعبر تحقّق الأمس (الـregex
              # يقبله)، ثم يُفجّر خطوة «حساب نافذة التغطية» في ريّة الغد بـValueError
              # قبل أن يبدأ الوكيل — فتتجمّد النشرة أبداً ولا يقدر الإصلاح الذاتي
              # على شيء. نسمّيه هنا بالاسم بدل تتبّع أثر بايثون خام.
              bad = bad_dates(t)
              if bad:
                  errs.append("%s: تواريخ مستحيلة تقويمياً في data-date: %s — صحّحها يدوياً في الملف" % (d, bad[:5]))
          if os.path.exists(h):
              g = open(h, encoding='utf-8').read()
              if mark not in g:
                  errs.append("%s لا يحوي «%s» — مركز التحكّم مدهوس؟" % (h, mark))
              if 'id="daily-date"' in g:
                  errs.append("%s يحوي id=daily-date — النشرة القديمة دهست مركز التحكّم." % h)
          if errs:
              print("❌ الفحص القبلي فشل — لن نشغّل الوكلاء على بنية خاطئة:")
              for e in errs: print("  -", e)
              sys.exit(1)
          print("✅ الفحص القبلي: %s هو ملف النشرة، %s مركز تحكّم سليم" % (d, h))
          PY

      - name: 📐 حساب نافذة التغطية
        id: cov
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re, datetime, os
          h = open(os.environ['DAILY_FILE'], encoding='utf-8').read()
          today = datetime.date.fromisoformat(
              os.popen("TZ=Asia/Jerusalem date +%F").read().strip())
          # ⚠️ متسامحون هنا عمداً: القارئ لا ينهار على بيانات فاسدة، بل يتخطّاها
          # ويكمل. الرفض مكانه بوّابتا «الفحص القبلي» و«التحقّق» — لا هنا. قبل
          # 26/08/2026 كان تاريخ واحد مستحيل يقتل هذه الخطوة ويجمّد النشرة أبداً.
          def _d(v):
              try:
                  return datetime.date.fromisoformat(v)
              except ValueError:
                  return None
          dates = sorted({v for v in re.findall(r'data-date="(\d{4}-\d{2}-\d{2})"', h) if _d(v)})
          # تواريخ المستقبل (فعاليات قادمة) تُستثنى من حساب التغطية.
          past = [d for d in dates if _d(d) <= today]
          last = _d(past[-1]) if past else today - datetime.timedelta(14)
          start = last
          gaps = [ (start + datetime.timedelta(n)).isoformat()
                   for n in range((today - start).days + 1)
                   if (start + datetime.timedelta(n)).isoformat() not in past ]
          print("last_covered=%s" % (past[-1] if past else 'none'))
          print("search_from=%s" % start.isoformat())
          print("today=%s" % today.isoformat())
          print("gaps=%s" % (','.join(gaps) if gaps else 'none'))
          print("cards=%d" % len(re.findall(r'<div class="item"', h)))
          print("future=%d" % len([d for d in dates if d not in past]))
          PY
          echo "— نافذة البحث —"; tail -6 "$GITHUB_OUTPUT"

      - name: تشغيل Claude — الرصد وتحرير النشرة
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            أنت محرّر «غرفة رصد ملاطيا». مهمتك اليوم: تحديث قسم «النشرة اليومية» داخل `${{ env.DAILY_FILE }}`.

            أنت تعمل داخل GitHub Actions. **مهمتك: البحث وتحرير `${{ env.DAILY_FILE }}` فقط.** لا commit ولا push ولا FTP — سير العمل يتولّى ذلك بعدك. لديك موافقة قائمة؛ لا تطرح أسئلة.

            ═══════════════════════════════
            ⛔ **قاعدة المسار — اقرأها قبل كل شيء**
            ═══════════════════════════════
            **الملف الذي تحرّره: `${{ env.DAILY_FILE }}`** — هو وحده يحمل النشرة اليومية.

            **ممنوع منعاً باتاً فتح أو تعديل `${{ env.HUB_FILE }}`** — ذاك «مركز التحكّم»،
            صفحة بطاقات لا نشرة فيها ولا `daily-date`. في 24/08/2026 أُعيدت تسمية ملف
            النشرة، وبقي سير العمل يستهدف مركز التحكّم، فتوقّفت النشرة أياماً.
            إن كتبتَ نشرةً داخل مركز التحكّم دهستَ الصفحة الرئيسية للمنظومة.
            سير العمل يفحص هذا بعدك ويُفشل الريّة إن مُسَّ أي ملف آخر.

            وكذلك **لا تلمس**: `malatya/aqar*.html` · `land-*.html` · `reports*` · `library.html` · `docs/` · `assets/` · `data/` · `guide.html`.

            ═══════════════════════════════
            ⛔ **قاعدة الجولة الواحدة — أهمّ قاعدة في هذا الملف**
            ═══════════════════════════════
            أنت تعمل في **ريّة دفعة واحدة غير تفاعلية** داخل GitHub Actions.
            **لا توجد جولة تالية، ولا إشعارات، ولا استيقاظ لاحق، ولا أحد يردّ عليك.**
            في اللحظة التي تُنهي فيها ردّك تموت العملية، وكلّ ما لم تكتبه في الملف يضيع.

            لذلك، **ممنوع منعاً باتاً**:
            - `ScheduleWakeup` أو أي جدولة أو تأجيل أو `/loop`.
            - أن تقول «سأنتظر إشعارات إتمام الوكلاء» أو «سأكتب فور وصول النتائج».
              **لن تصل أي نتيجة بعد انتهاء ردّك.**
            - أن تُنهي ردّك والوكلاء «قيد العمل».

            استدعاء الوكيل **يُعيد نتيجته إليك في نفس النداء** — انتظرها في مكانك،
            ثم اكتبها في الملف فوراً. عطل 26/08/2026 كان بالضبط هذا: أطلق الوكلاء
            الستة، ثمّ استدعى `ScheduleWakeup` وقال «سأنتظر الإشعارات»، فانتهت الريّة
            بعد ١٥ جولة وقد تغيّر **سطر واحد** في الملف — الختم فقط، بلا خبر واحد.

            ═══════════════════════════════
            **الخطوة ١ — التاريخ، ثم حدّث الختم فوراً**
            ═══════════════════════════════
            ١. نفّذ: `TZ=Asia/Jerusalem date '+%A %-d %B %Y — %H:%M'` (بالعربية).

            ٢. ⛔ **افعل هذا الآن، قبل أي بحث:** افتح `${{ env.DAILY_FILE }}` وبدّل نصّ
            `<span id="daily-date">…</span>` بالتاريخ الذي حصلت عليه للتوّ، ثم احفظ.

            **لماذا الآن؟** ريّة تنتهي دون أي تعديل يرفضها التحقّق وتُعدّ عُطلاً.
            بتحديث الختم أوّلاً تضمن ريّة صادقة حتى لو تعثّر البحث لاحقاً.

            ═══════════════════════════════
            **الخطوة ٢ — نافذة البحث (محسوبة آلياً — لا تُخمّنها)**
            ═══════════════════════════════
            - **آخر يوم مغطّى:** `${{ steps.cov.outputs.last_covered }}`
            - **ابحث ابتداءً من:** `${{ steps.cov.outputs.search_from }}` وحتى `${{ steps.cov.outputs.today }}`
            - **أيام بلا تغطية:** `${{ steps.cov.outputs.gaps }}`
            - البطاقات الحالية: `${{ steps.cov.outputs.cards }}`

            ⚠️ ابحث فقط عمّا هو أحدث من `last_covered`، وركّز على أيام `gaps`.

            ═══════════════════════════════
            **الخطوة ٣ — ستة وكلاء بحث بالتوازي**
            ═══════════════════════════════
            **إن توفّرت أداة الوكلاء** (Task أو Agent): شغّل **٦ وكلاء** بالتوازي (subagent_type: general-purpose، في رسالة واحدة).
            **وإن لم تتوفّر — لا تتوقّف**: نفّذ المحاور الستّة بنفسك عبر WebSearch وWebFetch، محوراً بعد محور.
            كل وكيل: يبحث بالتركية/الإنجليزية/العربية، يركّز على آخر **١٠ أيام**، يترجم للعربية، ويعيد ٨–١٤ عنصراً (عنوان عربي · ملخّص سطرين · سعر/رقم إن وُجد · تاريخ · قضاء/قرية · مصدر+رابط). كل وكيل يصرّح صراحةً إن لم يجد جديداً. **ممنوع الاختلاق.**

            ١. **الأسواق والعروض** — BİM · A101 · ŞOK · Migros · CarrefourSA · سوق الجملة (hal) · Esenlik
            ٢. **العقارات والأراضي** — إيجار/بيع ₺/م² وبساتين المشمش حسب الحي (sahibinden · hepsiemlak · emlakjet) + TOKİ/البلدية
            ٣. **المطاعم والكافيهات والأفران** — وأسعار الخبز
            ٤. **المجمّعات والبازارات والمنتزهات** — Malatya Park AVM · سوق الشيرة · الأسواق الأسبوعية
            ٥. **الاقتصاد والمشمش** — بورصة ملاطيا (malatyatb.org.tr) · الصادرات · OSB · الوظائف
            ٦. **الأخبار والبلدية والأقضية** — Battalgazi · Yeşilyurt · Darende · Akçadağ · Doğanşehir · Arapgir · Hekimhan · Pütürge · Yazıhan · Kuluncak · Arguvan · Kale · Doğanyol

            انتظر الوكلاء الستة جميعاً **داخل هذه الجولة** قبل المتابعة — نتيجة كل
            وكيل تعود إليك مباشرةً من نداء الأداة. لا تجدول، ولا تنتظر إشعاراً، ولا
            تُنهِ ردّك قبل أن تُمسك بأيدي النتائج الستّ وتكتبها.

            ═══════════════════════════════
            **الخطوة ٤ — التحرير (اكتب أوّلاً بأوّل!)**
            ═══════════════════════════════
            ⚠️ **لا تجمع كل النتائج ثم تكتب في النهاية.** فور انتهاء وكيل من محوره —
            **اكتب بطاقاته في الملف فوراً** عبر Edit، ثم انتقل للمحور التالي.
            سبع كتابات صغيرة، لا كتابة واحدة كبيرة.

            بعد كل المحاور: احذف المكرّر، واختر **«أبرز ٥ اليوم»**.
            قسمٌ بلا جديد ⇐ `<p class="empty">لا جديد بارز اليوم في هذا القسم</p>`.
            **لا تحذف الأرشيف:** العناصر القديمة تبقى. أضِف الجديد فوقها.

            ═══════════════════════════════
            **الخطوة ٥ — بناء HTML النشرة**
            ═══════════════════════════════
            استبدل ما بين `<!--DAILY-CONTENT-START-->` و `<!--DAILY-CONTENT-END-->` فقط. **أبقِ العلامتين.**

            - لكل قسم: `<h2><span class="sec-ico">أيقونة</span> العنوان <span class="count">عدد</span></h2>`
            - «أبرز اليوم» داخل `<div class="highlights">…</div>`
            - كل خبر:
            ```
            <div class="item" data-date="YYYY-MM-DD"><h3>العنوان</h3><p>الملخّص</p><div class="meta"><span class="badge b-price">سعر</span><span class="badge b-date">تاريخ</span><span class="badge b-area">منطقة</span><a class="src" href="URL" target="_blank" rel="noopener">المصدر ↗</a></div></div>
            ```

            ⚠️ **`data-date` إلزامي في كل بطاقة** بصيغة `YYYY-MM-DD` بالضبط.

            **الأقسام السبعة بالترتيب:**
            ⭐ أبرز اليوم · 🛒 الأسعار والعروض · 🏢 العقارات والأراضي · 🍽️ المطاعم والكافيهات والأفران · 🏬 المجمّعات والبازارات والمنتزهات · 🌾 الاقتصاد والمشمش والزراعة · 📰 الأخبار والبلدية والقرى

            ═══════════════════════════════
            **الخطوة ٦ — الترويسة والأرقام**
            ═══════════════════════════════
            - حدّث `<span id="daily-date">…</span>` بتاريخ اليوم.
            - حدّث أرقام شريط `<div class="chips">…</div>`.
            - **لا تلمس** سكربت `sortDaily` ولا بقيّة أقسام الدليل.

            ═══════════════════════════════
            **الخطوة ٧ — فحص ذاتي قبل الإنهاء**
            ═══════════════════════════════
            - نفّذ `git diff --stat -- ${{ env.DAILY_FILE }}` — **إن أظهر سطراً واحداً
              متغيّراً فأنت لم تكتب شيئاً سوى الختم**: ارجع فوراً واكتب بطاقات المحاور
              الستّة قبل أن تُنهي ردّك. سطرٌ واحد = ريّة فاشلة مهما بدت مرتّبة.
            - `git status --porcelain` يجب ألّا يُظهر إلا `${{ env.DAILY_FILE }}`
            - `DAILY-CONTENT-START` و`DAILY-CONTENT-END` — مرّة واحدة لكلٍّ
            - `id="daily-date"` — مرّة واحدة
            - كل `<div class="item"` لديه `data-date` صالح
            - توازن `<div>`، لا مُعرِّفات مكرّرة، الأقسام السبعة موجودة، الحجم لم ينكمش

            ⛔ **الملف يجب أن يتغيّر في كل ريّة** — ولو بتحديث الختم وحده.

            ═══════════════════════════════
            **الخطوة ٨ — تقرير الرصد داخل الملف (إلزامي)**
            ═══════════════════════════════
            استبدل بلوك `<!--RESEARCH-REPORT ... -->` (أو أضِفه بعد `<!--DAILY-CONTENT-START-->`):

            ```
            <!--RESEARCH-REPORT
            run=YYYY-MM-DD HH:MM | window=<search_from>..<today>
            🛒 found=N covered=N written=N
            … (كل المحاور الستّة)
            note=<سطر واحد: لماذا كانت الحصيلة صفراً إن كانت كذلك>
            -->
            ```

            صفر مقبول — صفر بلا تفسير ليس مقبولاً.

            **تقرير ختامي بالعربية:** ما أُضيف لكل قسم · أبرز ٥ · ما لم يُعثر عليه · المصادر بروابط.
          claude_args: |
            --allowedTools "Read,Write,Edit,Bash,WebFetch,WebSearch,Glob,Grep,Task,Agent"
            --disallowedTools "ScheduleWakeup,CronCreate,CronList,CronDelete,Monitor,SendMessage,PushNotification"
            --permission-mode acceptEdits
            --max-turns 120

      - name: 🔍 ماذا فعل Claude فعلاً؟
        if: always()
        run: |
          set +e
          F=/home/runner/work/_temp/claude-execution-output.json
          echo "── حالة الملف ──"
          git diff --stat -- "$DAILY_FILE" || true
          git diff --quiet -- "$DAILY_FILE" && echo "⚠️ الملف لم يُمسّ إطلاقاً" || echo "✅ الملف عُدِّل"
          echo
          echo "── ردّ Claude النصّي ──"
          if [ -f "$F" ]; then
            python3 - "$F" <<'PY'
          import json, sys
          try:
              d = json.load(open(sys.argv[1], encoding='utf-8'))
          except Exception as e:
              print("تعذّر تحليل JSON:", e); sys.exit(0)
          items = d if isinstance(d, list) else [d]
          for it in items:
              if not isinstance(it, dict): continue
              if it.get('type') == 'result':
                  print("subtype:", it.get('subtype'), "| is_error:", it.get('is_error'))
                  print("turns:", it.get('num_turns'))
                  r = it.get('result')
                  if r: print("\n--- النصّ ---\n", str(r)[:3000])
              msg = (it.get('message') or {})
              for c in (msg.get('content') or []):
                  if isinstance(c, dict):
                      if c.get('type') == 'text' and c.get('text', '').strip():
                          print("[نصّ]", c['text'][:900])
                      elif c.get('type') == 'tool_use':
                          print("[أداة]", c.get('name'))
          PY
          else
            echo "لا يوجد ملف مخرجات في $F"
          fi
          exit 0

      # ═══════════════════════════════════════════════════════════
      # التطويق: لا يخرج قلم Claude خارج ملف النشرة. هذا ما يمنع
      # تكرار كارثة «النشرة دهست مركز التحكّم».
      # ═══════════════════════════════════════════════════════════
      - name: 🚧 تطويق — لم يُمسّ إلا ملف النشرة
        run: |
          set -euo pipefail
          CH=$(git status --porcelain --untracked-files=all | sed 's/^...//')
          echo "الملفات المتغيّرة:"; echo "${CH:-(لا شيء)}"
          BAD=$(printf '%s\n' "$CH" | grep -v -x "$DAILY_FILE" | grep -v -x '' || true)
          if [ -n "$BAD" ]; then
            echo "❌ عُدِّلت ملفات ممنوعة — أُلغيت الريّة حمايةً للمنظومة:"
            echo "$BAD"
            exit 1
          fi
          echo "✅ التطويق سليم"

      # ═══════════════════════════════════════════════════════════
      # ختم تقرير الرصد — بياناتٌ آليّة يملكها سير العمل، لا الوكيل.
      # سبب عطل 26/08/2026: Claude حدّث الختم وحرّر النشرة فعلاً، لكنه
      # ترك بلوك <!--RESEARCH-REPORT--> بتاريخ الأمس، فأفشل «التحقّق»
      # الريّةَ كاملةً قبل الـcommit — فضاع تحريرٌ سليم وتجمّدت النشرة.
      # القاعدة: لا تُهدَر ريّة صالحة بسبب سطر بيانات وصفية. نختم نحن،
      # ونرفع راية report_degraded ليقرأها الحارس وأي مراقب خارجي.
      # ═══════════════════════════════════════════════════════════
      - name: 🖋️ ختم تقرير الرصد
        id: report
        env:
          SEARCH_FROM: ${{ steps.cov.outputs.search_from }}
        run: |
          set -euo pipefail
          # النسخة السابقة من الملف — لقياس ما أضافه الوكيل فعلاً هذه الريّة.
          # التسامح مع ملف غير موجود في HEAD (أوّل إضافة) بدل قتل الريّة.
          git show "HEAD:$DAILY_FILE" > /tmp/before-stamp.html 2>/dev/null || : > /tmp/before-stamp.html
          # الأسطر المضافة وحدها — مقياسٌ لا يخدعه طيّ الأرشيف ولا إعادة الترتيب.
          git diff -U0 -- "$DAILY_FILE" > /tmp/daily.diff 2>/dev/null || : > /tmp/daily.diff
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re, os
          p = os.environ['DAILY_FILE']
          h = open(p, encoding='utf-8').read()
          before = open('/tmp/before-stamp.html', encoding='utf-8').read()
          # cards_written = بطاقات ظهرت في أسطر مُضافة فعلاً في هذه الريّة.
          # ⚠️ لماذا لا يكفي الفرق الصافي: يوم يُطوى فيه الأرشيف تنقص البطاقات
          # صافيةً بينما الوكيل كتب عشرات الجديدة — الفرق الصافي يرفع رايةً كاذبة.
          # والعكس أخطر: ريّة ثانية في اليوم نفسه تجد التقرير مختوماً فتبدو سليمة.
          added = [l[1:] for l in open('/tmp/daily.diff', encoding='utf-8', errors='replace')
                   if l.startswith('+') and not l.startswith('+++')]
          cards_written = sum(x.count('<div class="item"') for x in added)
          # ⚠️ لا يكفي أن يحمل بلوك التقرير تاريخ اليوم: ريّة ثانية في اليوم نفسه
          # تجد البلوك مختوماً من الريّة الأولى فتبدو سليمة وهي لم تكتب شيئاً.
          # المقياس الصادق: كم بطاقة أضاف الوكيل في هذه الريّة بالذات.
          cards_added = len(re.findall(r'<div class="item"', h)) - \
                        len(re.findall(r'<div class="item"', before))
          today = os.popen("TZ=Asia/Jerusalem date +%F").read().strip()
          hm    = os.popen("TZ=Asia/Jerusalem date +%H:%M").read().strip()
          win   = "%s..%s" % (os.environ.get('SEARCH_FROM') or today, today)
          runln = "run=%s %s | window=%s | source=workflow-stamp" % (today, hm, win)
          m = re.search(r'<!--RESEARCH-REPORT(.*?)-->', h, re.S)
          degraded = "false"
          if not m:
              block = ("<!--RESEARCH-REPORT\n" + runln +
                       "\nnote=الوكيل لم يكتب تقرير رصد — حصيلة هذه الريّة غير موثّقة.\n-->")
              anchor = "<!--DAILY-CONTENT-START-->"
              h = h.replace(anchor, anchor + "\n" + block, 1)
              degraded = "true"
          elif today not in m.group(1):
              body = m.group(1)
              nb, n = re.subn(r'(?m)^run=.*$', runln, body, count=1)
              if n == 0:
                  nb = "\n" + runln + body
              if 'stamped_by=workflow' not in nb:
                  nb = nb.rstrip("\n") + "\nstamped_by=workflow — الوكيل لم يجدّد تقريره؛ الأرقام أعلاه قد تكون من ريّة سابقة.\n"
              h = h[:m.start()] + "<!--RESEARCH-REPORT" + nb + "-->" + h[m.end():]
              degraded = "true"
          # ⚠️ رايتان مختلفتان عمداً، لأنّ علاجهما مختلف:
          #   sterile  = لم تُكتب بطاقة واحدة ⇒ عطل حقيقي، يستحقّ إعادة تشغيل وبلاغاً.
          #   degraded = عقيمة **أو** تقرير خُتم آلياً ⇒ نقص توثيق، يُذكر ولا يُعاد له تشغيل.
          # خلطهما يجعل الحارس يعيد تشغيل نشرةٍ صحيحة لأنّ الوكيل نسي سطر تقرير.
          sterile = "true" if cards_written <= 0 else "false"
          if sterile == "true":
              degraded = "true"
          open(p, 'w', encoding='utf-8').write(h)
          print("degraded=" + degraded)
          print("sterile=" + sterile)
          print("cards_written=%d" % cards_written)
          print("cards_added=%d" % cards_added)
          PY
          CW=$(grep -m1 '^cards_written=' "$GITHUB_OUTPUT" | cut -d= -f2)
          CA=$(grep -m1 '^cards_added=' "$GITHUB_OUTPUT" | cut -d= -f2)
          echo "بطاقات كتبها الوكيل هذه الريّة: ${CW:-؟} (الفرق الصافي: ${CA:-؟})"
          if grep -qx 'sterile=true' "$GITHUB_OUTPUT"; then
            echo "🌱 ريّة عقيمة — لم تُكتب بطاقة واحدة. هذا عطل، لا يوم هادئ."
            echo "🌱 sterile=true — لم تُكتب بطاقة واحدة (صافي: ${CA:-؟}). راجع «🔍 ماذا فعل Claude فعلاً؟»." >> "$GITHUB_STEP_SUMMARY"
          elif grep -qx 'degraded=true' "$GITHUB_OUTPUT"; then
            echo "⚠️ ${CW} بطاقة مكتوبة، لكنّ تقرير الرصد خُتم آلياً — نقص توثيق لا أكثر"
            echo "⚠️ report_degraded=true — ${CW} بطاقة مكتوبة، والتقرير خُتم آلياً." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ ريّة سليمة — التقرير من الوكيل و${CW} بطاقة مكتوبة"
          fi

      - name: التحقّق — لا ننشر ملفاً معطوباً
        run: |
          set -euo pipefail
          git show "HEAD:$DAILY_FILE" > /tmp/prev.html 2>/dev/null || : > /tmp/prev.html
          # tee: سبب الفشل يظهر في صفحة Summary بلا فتح السجلّ. pipefail يحفظ رمز الخروج.
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import re, sys, os, datetime

          path = os.environ['DAILY_FILE']
          new = open(path, encoding='utf-8').read()
          old = open('/tmp/prev.html', encoding='utf-8').read()
          hub = open(os.environ['HUB_FILE'], encoding='utf-8').read()
          errs, notes = [], []

          for a in ['DAILY-CONTENT-START', 'DAILY-CONTENT-END']:
              if new.count(a) != 1:
                  errs.append("العلامة %s ظهرت %d مرّة (المطلوب ١)" % (a, new.count(a)))
          n_dd = new.count('id="daily-date"')
          if n_dd != 1:
              errs.append('id="daily-date" ظهر %d مرّة (المطلوب ١)' % n_dd)

          # مركز التحكّم لم يُدهس
          if os.environ['HUB_MARK'] not in hub:
              errs.append("مركز التحكّم فقد عنوانه")
          if 'id="daily-date"' in hub:
              errs.append("مركز التحكّم صار يحوي daily-date — دهس!")

          if new.count('<div') != new.count('</div>'):
              errs.append("اختلال <div>: %d مفتوح مقابل %d مغلق" % (new.count('<div'), new.count('</div>')))
          ids = re.findall(r'\sid="([^"]+)"', new)
          dups = sorted({i for i in ids if ids.count(i) > 1})
          if dups:
              errs.append("مُعرِّفات مكرّرة: %s" % dups[:5])

          secs = re.findall(r'<h2[^>]*>\s*<span class="sec-ico">', new)
          if len(secs) < 7:
              errs.append("عدد الأقسام %d (المطلوب ٧ على الأقل)" % len(secs))
          else:
              notes.append("الأقسام %d" % len(secs))

          cards = re.findall(r'<div class="item"([^>]*)>', new)
          missing = [c for c in cards if 'data-date=' not in c]
          dates = re.findall(r'<div class="item"[^>]*data-date="([^"]*)"', new)
          # ⚠️ الشكل وحده لا يكفي: `2026-13-45` و`2026-02-30` يمرّان من الـregex
          # ثم يقتلان خطوة «حساب نافذة التغطية» في الريّة التالية. نرفضهما هنا،
          # عند البوّابة، قبل الـcommit — فالمنع أرخص من تجميدٍ يحتاج يداً بشرية.
          def _cal_ok(v):
              if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', v):
                  return False
              try:
                  datetime.date.fromisoformat(v)
                  return True
              except ValueError:
                  return False
          bad = [d for d in dates if not _cal_ok(d)]
          if missing:
              errs.append("%d بطاقة بلا data-date" % len(missing))
          if bad:
              errs.append("data-date غير صالح (صيغة خاطئة أو تاريخ مستحيل تقويمياً): %s" % bad[:5])
          if cards and not missing and not bad:
              notes.append("البطاقات %d كلّها بتاريخ صالح (%s→%s)" % (len(cards), min(dates), max(dates)))
          if len(cards) < 10:
              errs.append("عدد البطاقات %d — يبدو أن الأرشيف حُذف" % len(cards))

          # ⚠️ القسمة على len(old) تنفجر إن كان الملف جديداً بالكامل (لا نسخة في
          # HEAD). المقارنات النسبية بلا نسخة سابقة بلا معنى أصلاً — نتخطّاها.
          if old:
              old_cards = len(re.findall(r'<div class="item"', old))
              if len(cards) < old_cards * 0.8:
                  errs.append("تراجع البطاقات %d → %d — فقدان أرشيف" % (old_cards, len(cards)))
              shrink = 1 - len(new) / len(old)
              if shrink > 0.20:
                  errs.append("انكمش الملف %.1f%% (%d → %d)" % (shrink * 100, len(old), len(new)))
              else:
                  notes.append("الحجم %d → %d (%+.1f%%)" % (len(old), len(new), -shrink * 100))
          else:
              notes.append("لا نسخة سابقة في HEAD — تُخطّيت مقارنات الحجم والأرشيف")

          rep = re.search(r'<!--RESEARCH-REPORT(.*?)-->', new, re.S)
          if not rep:
              errs.append("بلوك <!--RESEARCH-REPORT--> مفقود")
          else:
              tod = os.popen("TZ=Asia/Jerusalem date +%F").read().strip()
              if tod not in rep.group(1):
                  errs.append("تقرير الرصد قديم — لا يحمل تاريخ اليوم (%s)" % tod)
              else:
                  w = sum(int(x) for x in re.findall(r'written=(\d+)', rep.group(1)))
                  notes.append("تقرير الرصد: %d بطاقة مكتوبة" % w)

          if len(cards) > 400:
              errs.append("%d بطاقة — تجاوزنا الحدّ. فعّل طيّ الأرشيف." % len(cards))

          if new == old:
              errs.append("الملف لم يتغيّر إطلاقاً — عُطل صامت، لا يوم هادئ.")
          else:
              def _dd(t):
                  m = re.search(r'id="daily-date"[^>]*>([^<]*)', t)
                  return m.group(1).strip() if m else ""
              if _dd(new) == _dd(old):
                  errs.append("ختم التاريخ لم يتغيّر (%s) رغم تعديل الملف" % _dd(old))
              else:
                  notes.append("الختم %s → %s" % (_dd(old), _dd(new)))

          if errs:
              print("❌ فشل التحقّق:")
              for e in errs: print("  -", e)
              sys.exit(1)
          print("✅ نجح التحقّق — " + " · ".join(notes))
          PY

      # ═══════════════════════════════════════════════════════════
      # نبضة آلية: status.json يقرأه الحارس وأي مراقب خارجي بدقّة،
      # بلا تحويل HTML إلى نصّ وبلا تخمين أعداد.
      # ═══════════════════════════════════════════════════════════
      - name: 🧾 توليد malatya/status.json
        env:
          REPORT_DEGRADED: ${{ steps.report.outputs.degraded }}
          CARDS_ADDED: ${{ steps.report.outputs.cards_added }}
          CARDS_WRITTEN: ${{ steps.report.outputs.cards_written }}
          STERILE: ${{ steps.report.outputs.sterile }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, json, os
          p = os.environ['DAILY_FILE']
          h = open(p, encoding='utf-8').read()
          today = os.popen("TZ=Asia/Jerusalem date +%F").read().strip()
          nowiso = os.popen("TZ=Asia/Jerusalem date -Iseconds").read().strip()
          stamp = re.search(r'id="daily-date"[^>]*>([^<]*)', h)
          dates = re.findall(r'<div class="item"[^>]*data-date="([^"]*)"', h)
          rep = re.search(r'<!--RESEARCH-REPORT(.*?)-->', h, re.S)
          written = sum(int(x) for x in re.findall(r'written=(\d+)', rep.group(1))) if rep else None
          data = {
            "date": today,
            "stamp": stamp.group(1).strip() if stamp else None,
            "generated_at": nowiso,
            "items": len(re.findall(r'<div class="item"', h)),
            "sections": len(re.findall(r'<h2[^>]*>\s*<span class="sec-ico">', h)),
            "oldest_data_date": min(dates) if dates else None,
            "newest_data_date": max(dates) if dates else None,
            "written_today": written,
            "chars": len(h),
            "report_degraded": os.environ.get('REPORT_DEGRADED') == 'true',
            "sterile": os.environ.get('STERILE') == 'true',
            "cards_written": int(os.environ.get('CARDS_WRITTEN') or 0),
            "cards_added": int(os.environ.get('CARDS_ADDED') or 0),
            "daily_file": p,
            "commit": os.environ.get('GITHUB_SHA', '')[:12],
            "run_url": "%s/%s/actions/runs/%s" % (os.environ.get('GITHUB_SERVER_URL',''),
                                                  os.environ.get('GITHUB_REPOSITORY',''),
                                                  os.environ.get('GITHUB_RUN_ID','')),
          }
          json.dump(data, open('malatya/status.json','w',encoding='utf-8'),
                    ensure_ascii=False, indent=2)
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Commit ودفع إلى main
        id: commit
        run: |
          set -euo pipefail
          git config user.name  "malatya-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DAILY_FILE" malatya/status.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "لا تغيير — تخطّي النشر"
            exit 0
          fi
          git commit -m "النشرة اليومية — $(TZ=Asia/Jerusalem date '+%Y-%m-%d %H:%M')"
          # ═══════════════════════════════════════════════════════════
          # دفعٌ مقاوم للتسابق. خمسة سيور عمل تدفع إلى main (النشرة ·
          # الأراضي · العقارات · الاستثمار · دليل Claude)، وكلٌّ منها قد
          # يعمل حتى ٤٥ دقيقة، وجدولة GitHub تتأخّر ساعةً أحياناً — في
          # 26/08/2026 انطلقت النشرة 07:05 بدل 06:10 فلامست موعد الاستثمار.
          # عند التداخل يُرفض دفع الثاني (non-fast-forward)، ومع set -e
          # تموت الريّة وتضيع ساعة بحث كاملة. لذلك: أعِد الأساس وأعِد المحاولة.
          # ═══════════════════════════════════════════════════════════
          for i in 1 2 3 4 5; do
            if git push; then echo "✅ دُفع إلى main (محاولة $i)"; break; fi
            if [ "$i" = "5" ]; then
              echo "❌ تعذّر الدفع بعد خمس محاولات — main يتغيّر أسرع من قدرتنا"; exit 1
            fi
            echo "↻ main تقدّم أثناء عملنا — أُعيد الأساس وأحاول ثانيةً (محاولة $i)"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort 2>/dev/null || true
              # ═══════════════════════════════════════════════════════════
              # تعارضٌ حقيقي: ريّةٌ أخرى حرّرت ملف النشرة نفسه بينما كنّا نبحث.
              # دمجُهما آلياً غير ممكن بأمان (نصّان مختلفان لليوم ذاته)، وفرضُ
              # أحدهما يبتلع بطاقات الآخر. لكنّ إسقاط ١٥ دقيقة بحثٍ في العدم
              # غير مقبول أيضاً — وهذا ما جرى فعلاً في 27/08/2026 00:08 حين
              # ضاعت ١٦٠ إضافة. لذلك: نحفظ عملنا في فرع إنقاذ ثم نفشل بوضوح.
              # ═══════════════════════════════════════════════════════════
              RESCUE="rescue/daily-$(TZ=Asia/Jerusalem date +%Y%m%d-%H%M%S)"
              if git push origin "HEAD:refs/heads/$RESCUE" 2>/dev/null; then
                echo "🛟 تعارض مع main — لم يضِع شيء: عمل هذه الريّة محفوظ في الفرع $RESCUE"
                {
                  echo "## 🛟 تعارض دفع — العمل محفوظ"
                  echo "ريّة أخرى حرّرت \`$DAILY_FILE\` أثناء بحثنا، فتعذّر الدمج الآلي."
                  echo "بطاقات هذه الريّة محفوظة في الفرع: \`$RESCUE\`"
                  echo "قارنها بـ main واختر ما يُدمج يدوياً — لا شيء ضاع."
                } >> "$GITHUB_STEP_SUMMARY"
              else
                echo "❌ تعارض مع main وتعذّر حتى حفظ فرع الإنقاذ"
              fi
              exit 1
            fi
            sleep $((i * 5))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # ⛔ لا نرفع عبر FTP من هنا. malatya-publish.yml هو المالك الوحيد لملف
  # الحالة .ftp-deploy-malatya-state.json. الرفع من مكانين بمجلّدين مختلفين
  # يجعل الرفعة التالية تحذف من الخادم كل ما ليس في المجلّد الحالي.
  publish:
    name: نشر المجلّد كاملاً
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/malatya-publish.yml
    secrets: inherit
