name: وكيل الأراضي — ملاطيا

# 05:10 UTC = 08:10 بتوقيت القدس (صيفاً) — بين وكيل العقارات والنشرة اليومية.
on:
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: malatya-land
  cancel-in-progress: false

jobs:
  watch:
    name: رصد · تقييم · تحديث اللوحة
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # انظر التعليق نفسه في malatya-aqar.yml: التاريخ يُحقن ولا يُستنتج.
      - name: تاريخ اليوم
        id: d
        run: echo "today=$(TZ=Asia/Jerusalem date '+%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      # ═══════════════════════════════════════════════════════════
      # 💱 سعر الصرف — يُجلب هنا مرّة واحدة ويُمرَّر إلى الوكيل جاهزاً.
      # قاعدة المنظومة: كل سعر يُعرض بالليرة والدولار والشيكل معاً، بسعر
      # صرف يوم التقرير نفسه. الوكيل لا يجلب سعراً ولا يستعيده من ذاكرته —
      # سعرٌ واحد لكل الريّة يجعل أرقام التقرير متّسقة وقابلة للمراجعة.
      # فشل الجلب لا يُسقط الريّة: ok=false، والوكيل يكتب بالليرة وحدها
      # ويقول ذلك صراحةً بدل أن يخترع سعراً.
      # ═══════════════════════════════════════════════════════════
      - name: 💱 سعر صرف اليوم — ليرة · دولار · شيكل
        id: fx
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys, urllib.request
          SRC = [
              ("open.er-api.com", "https://open.er-api.com/v6/latest/TRY",
               lambda d: (d["rates"]["USD"], d["rates"]["ILS"], d.get("time_last_update_utc", ""))),
              ("frankfurter.app", "https://api.frankfurter.dev/v1/latest?from=TRY&to=USD,ILS",
               lambda d: (d["rates"]["USD"], d["rates"]["ILS"], d.get("date", ""))),
          ]
          usd = ils = None
          src = "none"
          asof = ""
          for name, url, pick in SRC:
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      u, i, a = pick(json.load(r))
                  if u and i:
                      usd, ils, src, asof = float(u), float(i), name, str(a)
                      break
              except Exception as e:
                  print("تعذّر %s: %s" % (name, e), file=sys.stderr)
          if usd and ils:
              print("ok=true")
              print("usd=%.4f" % usd)
              print("ils=%.4f" % ils)
              print("try_per_usd=%.2f" % (1 / usd))
              print("try_per_ils=%.2f" % (1 / ils))
              print("src=%s" % src)
              print("asof=%s" % asof)
              print("line=1 ₺ = $%.4f = ₪%.4f | $1 = ₺%.2f | ₪1 = ₺%.2f | src=%s"
                    % (usd, ils, 1 / usd, 1 / ils, src))
          else:
              print("ok=false")
              print("usd=0")
              print("ils=0")
              print("try_per_usd=0")
              print("try_per_ils=0")
              print("src=none")
              print("asof=")
              print("line=تعذّر جلب سعر الصرف اليوم — الأسعار بالليرة وحدها")
          PY
          echo "— سعر الصرف —"; tail -9 "$GITHUB_OUTPUT"

      - name: تشغيل Claude — رصد سوق الأراضي
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            أنت **«وكيل رصد أراضي ملاطيا»**. تعمل داخل GitHub Actions. لديك موافقة قائمة؛ لا تطرح أسئلة.
            **مهمتك: الرصد وتحديث ملفات البيانات فقط.** لا commit ولا push ولا رفع — سير العمل يتولّى ذلك بعدك.

            **الأطروحة:** قطع زراعية/مفرزة (tarla / arsa) تحمل **فجوة تحويل** من زراعي إلى عمراني.
            هذا وكيل منفصل تماماً عن وكيل الشقق — لا تخلط بينهما ولا تلمس ملفاته.
            **ممنوع الاختلاق**: كل رقم ورابط من صفحة جُلبت فعلاً. ما لم يُذكر = «غير معروف»، لا يُفترض الأفضل.

            ═══════════════════════════════
            💱 **قاعدة العملات الثلاث — كل سعر، بلا استثناء**
            ═══════════════════════════════
            سعر صرف اليوم **محسوبٌ لك في سير العمل** — لا تجلبه، ولا تحسبه، ولا تستعِده من ذاكرتك:
            **١ ₺ = $${{ steps.fx.outputs.usd }} = ₪${{ steps.fx.outputs.ils }}**
            (أي: $١ = ₺${{ steps.fx.outputs.try_per_usd }} · ₪١ = ₺${{ steps.fx.outputs.try_per_ils }}
            · المصدر `${{ steps.fx.outputs.src }}` · حالة الجلب `${{ steps.fx.outputs.ok }}`)

            كل مبلغ نقدي في تقرير اليوم `agents/src/land-*.md` — لقطة السوق، وجدول أعلى القطع،
            ومراجع السعر — يُكتب بالعملات الثلاث معاً بهذا الشكل بالضبط:

            `₺1.250 ($30 · ₪110)` · وللمتر: `₺550/م² ($13 · ₪48)`

            - الليرة أوّلاً كما وردت في المصدر (هي السعر الأصل)، والمقابلان بين قوسين بعدها.
            - فاصل الآلاف نقطة على الطريقة التركية (`18.500`)؛ بلا كسور فوق ١٠٠، وبخانتين تحتها.
            - نطاق سعري: القاعدة على الطرفين — `₺900–1.200 ($22–29 · ₪80–106)`.
            - ما ليس نقوداً (مساحات · أعداد · نِسَب · درجات · عائد ٪) يبقى كما هو بلا تحويل.
            - **لا تمسّ الأرقام الخام**: `ppm` و`avg` وكل قيم `land-listings.json` و`land-reports.json`
              تبقى أرقاماً مجرّدة بالليرة كما هي — التحويل للتقرير المقروء وحده.
            - إن كان `${{ steps.fx.outputs.ok }}` = `false`: اكتب الليرة وحدها وقل ذلك في
              «المنهجية والقيود». **لا تخترع سعر صرف.**

            ═══════════════════════════════
            **الخطوة ١ — التاريخ والحالة**
            ═══════════════════════════════
            تاريخ اليوم هو **${{ steps.d.outputs.today }}** — استعمله كما هو ولا تستنتجه.
            اقرأ `malatya/data/land-listings.json` (تراكمي، المفتاح = رابط الإعلان، يحفظ درجة كل قطعة)
            و`malatya/data/land-reports.json` (سجلّ يومي، مصفوفة).
            آخِر سجلّ فعليّ هو آخر عنصر في `land-reports.json` — **اقرأه ولا تفترضه**.
            إن وجدت فجوة بين تاريخه واليوم فاذكرها بصراحة في ملاحظة اليوم.
            **مهم:** احتفظ بالدرجات المخزّنة للقطع المعروفة؛ لا تُعِد تقييم إلا الجديد فعلاً.

            ═══════════════════════════════
            **الخطوة ٢ — المصادر**
            ═══════════════════════════════
            emlakjet، أربع صفحات: `satilik-tarla` و`satilik-arsa` لكلٍّ من `malatya-battalgazi` و`malatya-yesilyurt`.
            صيغتا بطاقة: كتلة `### [العنوان](رابط)`، وروابط مضغوطة سطراً واحداً (الأغنى — تحمل علم `YENİ`
            ومواصفات Parselli/Hisseli و Yolu Açılmış و Su/Elektrik/Kanalizasyon).
            وسّع عند الحاجة إلى بقية أقضية ملاطيا. **عند الفشل:** لا curl/بايثون — جرّب رابط فئة آخر فقط.

            ═══════════════════════════════
            **الخطوة ٣ — محرّك الركائز الخمس**
            ═══════════════════════════════
            الدرجة = التحويل ٣٠٪ · السعر ٢٥٪ · القانوني ٢٠٪ · التقني ١٥٪ · السيولة ١٠٪.

            **مراجع السعر (₺/م² خام ← بعد التطوير):** ياقنجا Yakınca 550→3000 · إكيزجة İkizce 400→2800 ·
            ملّاقاسم Mullakasım 450→2800 · كيلتبه Kiltepe 550→3000 · هاتونصويو Hatunsuyu 1200→4146 ·
            بحري Bahri 560→2500 · بوران Boran 976→2500.

            **سقوف إلزامية:** `hisseli` (مشاع) أو `sulu` (مروية) ⇐ سقف ٦٥ · بلا طريق ⇐ سقف ٦٠ · رهن/حجز ⇐ سقف ٤٠.
            **الطريق غير المذكور = مجهول (بلا سقف)، لا يُعامَل «yok».**

            ═══════════════════════════════
            **الخطوة ٤ — اكتب ثلاثة أشياء**
            ═══════════════════════════════

            **(أ) `malatya/data/land-listings.json`** — كائن، المفتاح = رابط الإعلان.
            أضِف الجديد فقط، حدّث السعر وتاريخ آخر ظهور. **لا تحذف أي مفتاح قديم.**

            **(ب) `malatya/data/land-reports.json`** — مصفوفة. أضِف سجلّ اليوم في **نهايتها** بهذا الشكل بالضبط:
            ```json
            {"date":"${{ steps.d.outputs.today }}","n":0,"hi":0,"hi_thr":65,"avg":0.0,
             "top":[{"nb":"اسم الحي","ppm":0,"sc":0.0,"url":"https://…"}],
             "note":"خلاصة سطرين"}
            ```
            `n` = عدد القطع المرصودة اليوم · `hi` = عدد القطع بدرجة **≥٦٥** · `avg` = متوسّط الدرجة.
            `hi_thr` = العتبة نفسها (٦٥) — تُكتب مع القيمة دائماً حتى يُقرأ الرقم القديم بعتبته لا بعتبة اليوم.

            > **لماذا ٦٥ لا ٧٠ (تغيّرت في 01/09/2026):** السقوف الإلزامية أعلاه تجعل ٧٠
            > غير قابلة للبلوغ عملياً — `hisseli` أو `sulu` ⇐ سقف ٦٥، وبلا طريق ⇐ ٦٠.
            > على مدى ٣٤ سجلّاً كان `hi` صفراً في كل يوم، وأعلى درجة سُجّلت قطّ هي ٦٩٫٤.
            > مؤشّرٌ لا يتحرّك أبداً لا يُخبر بشيء. العتبة الآن عند سقف `hisseli/sulu` نفسه:
            > «قطعة بلغت أقصى ما تسمح به قيودها المعلَنة» — وهذا حدٌّ له معنى.
            `top` = أعلى ٣ قطع. احتفظ بآخر **٤٥** سجلاً كحدّ أقصى.

            **(ج) `agents/src/land-${{ steps.d.outputs.today }}.md`** — تقرير اليوم بصيغة ماركداون (أنشئ المجلّد إن لزم):
            عنوان · لقطة السوق · جدول أعلى القطع (المساحة · ₺/م² · الدرجة · الأعلام · رابط الإعلان ·
            رابط خرائط جوجل بالاسم التركي) · ما الجديد مقابل أمس · المنهجية والقيود · تنويه أنّ هذا ليس نصيحة استثمارية.
            **يوم بلا جديد؟** اكتب التقرير على أي حال وقل ذلك صراحةً (السوق راكد أحياناً لأسابيع — هذه معلومة لا فشل).

            ═══════════════════════════════
            **الخطوة ٥ — فحص ذاتي قبل الإنهاء**
            ═══════════════════════════════
            - الملفّان JSON صالحان (`python3 -m json.tool`)
            - `land-reports.json` مصفوفة، وسجلّ اليوم موجود مرّة واحدة بتاريخ ${{ steps.d.outputs.today }}
            - `n` و`hi` و`avg` أرقام معقولة (`hi ≤ n`، و`avg` بين 0 و100)، و`hi_thr` = 65
            - `land-listings.json` لم ينكمش
            - كل رابط في `top[]` يبدأ بـ https
            - كل مبلغ في تقرير الماركداون بالعملات الثلاث `₺… ($… · ₪…)`، وقيم JSON بقيت أرقاماً بالليرة
            - **لا تلمس** أي ملف آخر: لا `daleel.html`، ولا `index.html`، ولا ملفات العقارات.

            **تقرير ختامي بالعربية:** كم قطعة جديدة · أعلى ٣ · ما لم يُعثر عليه · المصادر بروابط.
          claude_args: |
            --allowedTools "Read,Write,Edit,Bash,WebFetch,WebSearch,Glob,Grep,Agent"
            --permission-mode acceptEdits

      # كما في وكيل العقارات: تعثّر التقرير السرديّ لا يجوز أن يمنع حفظ
      # البيانات. الخطوة تُعلَّم فاشلة وتظهر في الواجهة، والريّة تكمل.
      - name: توليد صفحة التقرير وتحديث الفهرس
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 .github/scripts/build_report.py land

      - name: التحقّق — لا ننشر بيانات معطوبة
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, sys, os
          errs, notes = [], []
          TODAY = subprocess.run(['date','+%Y-%m-%d'],capture_output=True,text=True,
                                 env={**os.environ,'TZ':'Asia/Jerusalem'}).stdout.strip()

          def old(path):
              # ملفٌّ تالف في HEAD لا يجوز أن يُسقط البوّابة بأثر رجعي.
              r = subprocess.run(['git','show','HEAD:'+path],capture_output=True,text=True)
              try:
                  return json.loads(r.stdout) if r.returncode==0 and r.stdout.strip() else None
              except Exception:
                  return None

          rep = json.load(open('malatya/data/land-reports.json',encoding='utf-8'))
          lst = json.load(open('malatya/data/land-listings.json',encoding='utf-8'))
          if not isinstance(rep,list): errs.append('land-reports.json ليس مصفوفة')
          if not isinstance(lst,dict): errs.append('land-listings.json ليس كائناً')

          rows=[r for r in rep if r.get('date')==TODAY]
          if len(rows)!=1: errs.append(f'سجلّات اليوم {len(rows)} (المطلوب ١)')
          else:
              t=rows[0]
              for k in ('n','hi','hi_thr','avg','top'):
                  if k not in t: errs.append(f'حقل ناقص في سجلّ اليوم: {k}')
              # العتبة تُخزَّن مع القيمة: رقمٌ بلا عتبته يُقرأ غداً بعتبة غير عتبته.
              if t.get('hi_thr') != 65:
                  errs.append(f"hi_thr = {t.get('hi_thr')} والمتوقَّع 65")
              if isinstance(t.get('hi'),(int,float)) and isinstance(t.get('n'),(int,float)) and t['hi']>t['n']:
                  errs.append(f"hi ({t['hi']}) أكبر من n ({t['n']})")
              a=t.get('avg')
              if isinstance(a,(int,float)) and not (0<=a<=100): errs.append(f'avg خارج النطاق: {a}')
              for x in t.get('top',[]):
                  if not str(x.get('url','')).startswith('https://'):
                      errs.append(f"رابط غير صالح في top: {str(x.get('url'))[:50]}")
              notes.append(f"سجلّ اليوم: {t.get('n')} قطعة · ≥{t.get('hi_thr')}: {t.get('hi')} · متوسّط {t.get('avg')}")

          o=old('malatya/data/land-listings.json')
          if o and len(lst)<len(o): errs.append(f'تراجع السجل التراكمي {len(o)} → {len(lst)}')
          else: notes.append(f'السجل التراكمي {len(lst)} قطعة')

          idx=json.load(open('malatya/data/reports-index.json',encoding='utf-8'))
          miss=[r['file'] for r in idx if not os.path.exists('malatya/reports/'+r['file'])]
          if miss: errs.append(f'تقارير مفقودة: {miss[:3]}')
          else: notes.append(f'الفهرس {len(idx)} تقريراً')

          if errs:
              print('❌ فشل التحقّق:'); [print('  -',e) for e in errs]; sys.exit(1)
          print('✅ نجح التحقّق — ' + ' · '.join(notes))
          PY

      # وكيل الأراضي كان الوحيد بلا حارس نطاق، رغم أنّ أدواته أوسع الجميع
      # (Bash و WebFetch و Agent). التوجيه يطلب منه ألّا يمسّ غير ملفّاته —
      # والطلب ليس ضماناً. هنا يصير ضماناً.
      - name: حارس النطاق — لا نلمس ما ليس لنا
        run: |
          set -euo pipefail
          BAD=$(git status --porcelain \
                | awk '{print $2}' \
                | grep -Ev '^(malatya/data/land-|malatya/reports/land-|malatya/data/reports-index\.json|agents/src/land-)' \
                || true)
          if [ -n "$BAD" ]; then
            echo "❌ تعديل خارج نطاق وكيل الأراضي:"; echo "$BAD"; exit 1
          fi
          echo "✅ كل التعديلات داخل نطاق الوكيل"

      - name: Commit ودفع إلى main
        id: commit
        run: |
          set -euo pipefail
          echo "pushed=false" >> "$GITHUB_OUTPUT"

          git add -A malatya/data malatya/reports agents/src
          if git diff --cached --quiet; then
            echo "لا تغيير — لا commit"; exit 0
          fi
          git config user.name  "malatya-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "وكيل الأراضي — $(TZ=Asia/Jerusalem date '+%Y-%m-%d %H:%M')"
          # ═══════════════════════════════════════════════════════════
          # دفعٌ مقاوم للتسابق. خمسة سيور عمل تدفع إلى main (النشرة ·
          # الأراضي · العقارات · الاستثمار · دليل Claude)، وكلٌّ منها قد
          # يعمل حتى ٤٥ دقيقة، وجدولة GitHub تتأخّر ساعةً أحياناً — في
          # 26/08/2026 انطلقت النشرة 07:05 بدل 06:10 فلامست موعد الاستثمار.
          # عند التداخل يُرفض دفع الثاني (non-fast-forward)، ومع set -e
          # تموت الريّة وتضيع ساعة بحث كاملة. لذلك: أعِد الأساس وأعِد المحاولة.
          # ═══════════════════════════════════════════════════════════
          for i in 1 2 3 4 5; do
            if git push; then echo "✅ دُفع إلى main (محاولة $i)"; break; fi
            if [ "$i" = "5" ]; then
              echo "❌ تعذّر الدفع بعد خمس محاولات — main يتغيّر أسرع من قدرتنا"; exit 1
            fi
            echo "↻ main تقدّم أثناء عملنا — أُعيد الأساس وأحاول ثانيةً (محاولة $i)"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort 2>/dev/null || true
              echo "❌ تعارض حقيقي أثناء إعادة الأساس — يحتاج يداً بشرية، ولن نفرض شيئاً"
              exit 1
            fi
            sleep $((i * 5))
          done
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "✅ دُفع — سيُستدعى «نشر منظومة ملاطيا» الآن"

  publish:
    name: نشر إلى jmahery.com
    needs: watch
    if: needs.watch.outputs.pushed == 'true'
    uses: ./.github/workflows/malatya-publish.yml
    secrets: inherit
