name: نشر منظومة ملاطيا

# ينشر مجلّد malatya كاملاً إلى jmahery.com عند أي تغيير فيه —
# سواء جاء من النشرة اليومية، أو من وكيل العقارات، أو وكيل الأراضي،
# أو من رفعة يدوية عبر واجهة GitHub. هذا يسدّ الثغرة القديمة:
# «الرفع اليدوي كان لا ينشر شيئاً».
on:
  push:
    branches: [main]
    paths:
      - 'malatya/**'
  workflow_dispatch:
  # يُستدعى مباشرةً من النشرة ومن الوكيلين.
  # ضروري لأن الدفع بـ GITHUB_TOKEN لا يُطلق حدث push في سير عمل آخر.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: malatya-publish
  cancel-in-progress: false

# حساب FTP محبوس (chroot) داخل public_html/malatya — لا يرى الجذر إطلاقاً.
env:
  FTP_EXPECTED_USER_PREFIX: "malatya@"
  PORTAL_URL: "https://jmahery.com/malatya/"

jobs:
  publish:
    name: تجهيز · نشر · تحقّق
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # ⚠️ إلزامي: عند الاستدعاء عبر workflow_call يكون github.sha هو
          # لقطة *ما قبل* دفع الوكيل، فيُنشر شجرة قديمة. نثبّت على رأس main.
          ref: main

      - name: هل FTP مُعدّ؟
        id: ftp
        env:
          S: ${{ secrets.FTP_SERVER }}
          P: ${{ secrets.FTP_MALATYA_PASSWORD }}
        run: |
          if [ -n "$S" ] && [ -n "$P" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"; echo "✅ سننشر إلى الخادم"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "⏭️  بلا FTP — GitHub Pages يتحدّث كالعادة"
          fi

      - name: 🔒 بوّابة أمان — الحساب المحبوس فقط
        if: steps.ftp.outputs.enabled == 'true'
        env:
          U: ${{ secrets.FTP_MALATYA_USERNAME }}
        run: |
          set -euo pipefail
          case "$U" in
            "${FTP_EXPECTED_USER_PREFIX}"*)
              echo "✅ الحساب المحبوس داخل public_html/malatya" ;;
            "") echo "❌ FTP_MALATYA_USERNAME فارغ"; exit 1 ;;
            admin@*|eyad@*|smhmd1@*|guideclaude@*|*jmaheryc*)
              echo "❌ توقّف: '$U' حساب واسع الصلاحية."
              echo "   الجذر يحوي index.html (نظام الإدارة) و guide.html (دليل المغرب)."
              echo "   انشر فقط بحساب ${FTP_EXPECTED_USER_PREFIX}…"; exit 1 ;;
            *) echo "❌ توقّف: '$U' ليس الحساب المتوقّع ${FTP_EXPECTED_USER_PREFIX}…"; exit 1 ;;
          esac

      - name: تجهيز مجلد وسيط
        if: steps.ftp.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          rm -rf _deploy && mkdir -p _deploy
          # docs/ = مكتبة المستندات المحميّة بكلمة مرور — تعيش على الخادم فقط
          # (في .gitignore)، ولا تدخل النشر الآلي إطلاقاً.
          rsync -a --exclude 'docs/' --exclude '.git*' malatya/ _deploy/
          echo "— محتويات النشر —"; find _deploy -maxdepth 2 | sort | head -40
          # status.json = نبضة المنظومة: منه يقرأ الحارس والمراقب الخارجي.
          # لو سقط من الحزمة لبقي الحيّ يحمل نبضة أمس بصمت، وبدا الأمر
          # «انحراف مرآة» بينما السبب أنّ الملف لم يُرفع أصلاً.
          for f in status.json index.html daleel.html aqar.html reports.html library.html \
                   land-board.html aqar-board.html land-agent.html \
                   arsa.html data/arsa-listings.json \
                   admin.html install.html manual.html offline.html sw.js manifest.webmanifest data/arsa-overrides.json \
                   invest.html invest-legal.html invest-risk.html \
                   invest-paths.html invest-ops.html invest-sources.html invest-plan.html \
                   invest-nace.html data/invest-nace.json \
                   invest-sectors.html data/invest-sectors.json \
                   invest-docs.html invest-dd.html invest-log.html invest-model.html \
                   data/invest-docs.json data/invest-dd.json data/invest-costs.json \
                   data/invest-decisions-log.json data/invest-model.json \
                   data/invest-sources.json data/invest-structures.json data/invest-profile.json \
                   data/invest-incentive.json \
                   data/invest-risks.json data/invest-paths.json data/invest-watch.json \
                   assets/malatya.css assets/nav.js data/reports-index.json; do
            test -s "_deploy/$f" || { echo "❌ ناقص في حزمة النشر: $f"; exit 1; }
          done
          test ! -e _deploy/docs || { echo "❌ docs/ يجب ألّا تدخل النشر الآلي"; exit 1; }
          echo "✅ حزمة النشر مكتملة ($(find _deploy -type f | wc -l) ملفاً)"

      - name: الرفع عبر FTPS
        if: steps.ftp.outputs.enabled == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_MALATYA_USERNAME }}
          password: ${{ secrets.FTP_MALATYA_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./_deploy/
          server-dir: ./
          state-name: .ftp-deploy-malatya-state.json
          dangerous-clean-slate: false
          timeout: 60000
          log-level: standard

      - name: 🛡️ فحص السلامة — لم يُمسّ شيء آخر
        if: steps.ftp.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          FAIL=0
          T=$(date +%s)
          # ⚠️ ممنوع أنبوبٌ من curl إلى grep -q / head: هذان يغلقان الأنبوب فور
          # أوّل مطابقة، فيموت curl بـSIGPIPE ويعود «curl: (23) Failure writing
          # output to destination»، ومع pipefail يبدو الموقعُ السليم مفقوداً.
          # حدث فعلاً في ريّة 26/08/2026: «تعذّر تأكيد المرآة» والمرآة سليمة.
          # هنا الخطر أكبر: إنذار كاذب يرفع FAIL=1 ويُفشل النشر كلّه.
          # /mytask/ قد يكون مفتوحاً أو محميّاً بكلمة مرور. الحالتان سليمتان:
          #   200 + العلامة = مفتوح ويعمل · 401 = محميّ والخادم يردّ.
          # ما عداهما عطل. نقرأ الرمز أوّلاً ثم المحتوى، فلا نخلط «محميّ» بـ«ساقط».
          echo "— نظام إدارة المهامّ (/mytask/)؟"
          MT=$(curl -s -o /tmp/mytask.html -w "%{http_code}" --max-time 45 "https://jmahery.com/mytask/?c=$T")
          case "$MT" in
            401) echo "  🔒 محميّ بكلمة مرور — الخادم يردّ (401)" ;;
            200) if grep -q "ניהול משימות" /tmp/mytask.html; then
                   echo "  ✅ سليم ومفتوح"
                 else
                   echo "  🚨 يردّ 200 بلا علامة النظام — افحص فوراً"; FAIL=1
                 fi ;;
            *)   echo "  🚨 /mytask/ → $MT — افحص فوراً"; FAIL=1 ;;
          esac
          # الجذر لم يعد يخدم نظام المهامّ منذ 28/08/2026 (يحوّل إلى jmahery.co.il،
          # و/index.html يردّ 404). حالته تُطبَع للعلم ولا تُفشل النشر: النظام نفسه
          # سليم في /mytask/ وهو ما يفحصه الشرط أعلاه.
          RC=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "https://jmahery.com/?c=$T")
          echo "  ℹ️  جذر النطاق → $RC (تحويل خارجي — ليس بوّابة فشل)"
          # ما زال يجب أن يبقى مفتوحاً للعموم
          for u in "https://jmahery.com/guide.html" "https://guideclaude.jmahery.com/"; do
            C=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "$u?c=$T")
            [ "$C" = "200" ] && echo "  ✅ $u → 200" || { echo "  🚨 $u → $C"; FAIL=1; }
          done
          # الدليل التفاعلي انتقل في 31/08/2026 من جذر النطاق إلى /private/ وحُمي
          # بكلمة مرور. هنا 401 هو النجاح: الملف موجود والحماية قائمة. و200 هو
          # الإنذار — يعني أنّ الحماية سقطت والدليل صار مكشوفاً للعموم.
          PC=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "https://jmahery.com/private/?c=$T")
          case "$PC" in
            401) echo "  🔒 /private/ → 401 (الدليل محميّ كما يجب)" ;;
            200) echo "  🚨 /private/ → 200 — الحماية سقطت والدليل مكشوف!"; FAIL=1 ;;
            *)   echo "  🚨 /private/ → $PC (المتوقَّع 401)"; FAIL=1 ;;
          esac
          echo "— مكتبة المستندات: مفتوحة للمستخدم، ومغلقة أمام التصفّح كقائمة —"
          C=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "${PORTAL_URL}docs/?c=$T")
          case "$C" in
            403) echo "  ✅ docs/ → 403 (لا سرد للمجلّد — .htaccess فعّال)" ;;
            401) echo "  ℹ️  docs/ → 401 (ما زالت حماية كلمة المرور قائمة)" ;;
            *)   echo "  🚨 docs/ → $C (المفترض 403) — قد يكون .htaccess ضاع"; FAIL=1 ;;
          esac
          exit $FAIL

      - name: التحقّق من النشر الحيّ
        run: |
          set -euo pipefail
          echo "بانتظار GitHub Pages…"; sleep 90
          T=$(date +%s)
          # ننزّل إلى ملف ثم نقرأ — لا أنبوب من curl (انظر شرح SIGPIPE أعلاه).
          echo "— مركز التحكّم —"
          HC=$(curl -s -o /tmp/hub.html -w "%{http_code}" --max-time 45 "${PORTAL_URL}?n=$T")
          if [ "$HC" = "401" ]; then
            echo "  🔒 محميّ بكلمة مرور — لا يمكن قراءة المحتوى من هنا، وهذا متوقَّع"
          elif [ "$HC" = "200" ] && grep -q "منظومة ملاطيا" /tmp/hub.html; then
            echo "  ✅ حيّ"
          else
            echo "  ⚠️  تعذّر تأكيد مركز التحكّم (→ $HC)"
          fi
          echo "— الدليل والنشرة —"
          DC=$(curl -s -o /tmp/live-daleel.html -w "%{http_code}" --max-time 45 "${PORTAL_URL}daleel.html?n=$T")
          if [ "$DC" = "401" ]; then
            echo "  🔒 محميّ بكلمة مرور — ختم التاريخ يُقرأ من المرآة أدناه"
          elif [ "$DC" = "200" ]; then
            grep -m1 -o 'id="daily-date"[^>]*>[^<]*' /tmp/live-daleel.html \
              || echo "  ⚠️  لم يُعثر على ختم التاريخ في الصفحة الحيّة"
          else
            echo "  ⚠️  تعذّرت القراءة (→ $DC)"
          fi
          # مرآة GitHub Pages مُعطَّلة على هذا المستودع (has_pages=false، والمستودع
          # خاصّ). الاحتياطي الحقيقي هو المستودع نفسه: كل صفحة وكل ملفّ بيانات في
          # تاريخه ويُرجَع بضغطة. نذكر الحالة للعلم ولا نُحذّر من غياب شيء لم يُنشَر.
          echo "— مرآة GitHub Pages —"
          MC=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://smhmd1-cyber.github.io/claude-guide/malatya/?n=$T" || echo "000")
          if [ "$MC" = "200" ]; then
            echo "  ✅ حيّة"
          else
            echo "  ℹ️  المرآة غير مُفعَّلة ($MC) — الاحتياطي هو تاريخ المستودع"
          fi
