name: שומר המדריך (תיקון עצמי)

# למה זה קיים? `failure-alarm.yml` מבוסס על workflow_run — הוא מדבר רק
# *אחרי* שריצה הסתיימה. אם הריצה לא רצה בכלל (תזמון GitHub הוא "מאמץ
# מיטבי" ולפעמים מדלג, או שנתיב-קובץ השתנה) — הוא שותק, והמדריך קופא
# בשקט. השומר סוגר בדיוק את הפער הזה: בודק, מריץ מחדש לבד, ורק אם
# נכשל — פותח Issue ששולח לך מייל.
on:
  schedule:
    # 19/09/2026 — ארבע ריצות יומיות → שתיים, ורק בימי העדכון (א · ג · ה).
    # ① ריצת 08:45 הוסרה: העדכון קבוע ל-08:00 אך cron של GitHub מאחר שעות,
    #    כך ששומר ב-08:45 רואה "לא התעדכן היום" ומריץ מחדש עדכון שרץ תקין —
    #    אותה תקלה בדיוק שאותרה במספרים אצל שומר מלטיה (17/09: 2×18 דק' מבוזבזות).
    # ② הימים 1,3,5,6 הוסרו כי daily-guide-update.yml כבר לא רץ בהם, ושומר
    #    שמחפש עדכון "היום" ביום שאין בו עדכון היה מריץ אותו סתם — עלות במקום חיסכון.
    # ③ כל ריצה מחויבת בדקה שלמה גם אם ארכה 12 שניות; 28 ריצות/שבוע ← 6.
    - cron: "0 8 * * 0,2,4"     # 11:00 — הזדמנות תיקון ראשונה
    - cron: "0 14 * * 0,2,4"    # 17:00 — ניסיון אחרון, ואחריו Issue
  workflow_dispatch:
  # 24/09/2026 — אוחד הנה failure-alarm.yml (אותה מטרה, קובץ נפרד מיותר).
  # ה-job alarm_streak בתחתית הקובץ רץ רק באירוע הזה, בנפרד לגמרי מהתזמון.
  workflow_run:
    workflows: ["עדכון יומי — מדריך Claude"]
    types: [completed]

permissions:
  contents: write
  issues: write
  id-token: write
  actions: read

env:
  TARGET_WF: daily-guide-update.yml
  PAGES_URL: "https://smhmd1-cyber.github.io/claude-guide/"
  SUBDOMAIN_URL: "https://guideclaude.jmahery.com/"
  PAGE_MARK: "מדריך חכם אינטראקטיבי"

jobs:
  check:
    name: בדיקת מצב המדריך
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: guide-watchdog
      cancel-in-progress: false
    outputs:
      need_run: ${{ steps.probe.outputs.need_run }}
      escalate: ${{ steps.probe.outputs.escalate }}
      summary:  ${{ steps.probe.outputs.summary }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🔎 האם המדריך התעדכן היום?
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          T=$(date +%s)
          TODAY=$(TZ=Asia/Jerusalem date +%F)
          HM=$(TZ=Asia/Jerusalem date +%H%M)

          # ── מקור-אמת ראשי: הריצה המוצלחת האחרונה של העדכון היומי.
          # עדיף על "תאריך הקומיט האחרון", כי יום שקט בלי שינוי
          # אינו כשל — אבל ריצה שנכשלה כן.
          LAST_OK_ISO=$(gh run list --workflow "$TARGET_WF" --status success --limit 1 \
                        --json updatedAt --jq '.[0].updatedAt // empty' 2>/dev/null || echo "")
          LAST_OK=""
          [ -n "$LAST_OK_ISO" ] && LAST_OK=$(TZ=Asia/Jerusalem date -d "$LAST_OK_ISO" +%F 2>/dev/null || echo "")

          # ── גיבוי: תאריך הקומיט האחרון שנגע ב-index.html
          LAST_COMMIT=""
          C=$(git log -1 --format=%cI -- index.html 2>/dev/null || echo "")
          [ -n "$C" ] && LAST_COMMIT=$(TZ=Asia/Jerusalem date -d "$C" +%F 2>/dev/null || echo "")
          [ -z "$LAST_OK" ] && LAST_OK="$LAST_COMMIT"

          # ── האם ריצה כבר באוויר? אז לא מבקשים שנייה.
          BUSY=$(gh run list --workflow "$TARGET_WF" --limit 5 \
                 --json status --jq '[.[]|select(.status=="in_progress" or .status=="queued")]|length' 2>/dev/null || echo 0)

          # ── האם הגרסאות החיות בכלל עונות?
          # ⚠️ لا تمرّر curl عبر أنبوب إلى grep -q: مع pipefail يخرج grep عند أول
          # تطابق فيتلقّى curl إشارة SIGPIPE ويعود بخطأ، فتبدو الصفحة السليمة معطوبة.
          # الدليل ٢٫٣ ميغابايت والعنوان في أوّله — لذلك أخفق الاختبار الأول.
          PAGES_OK=no; SUB_OK=no
          if curl -fsSL --max-time 30 -o /tmp/pages.html "${PAGES_URL}?n=$T" 2>/dev/null; then
            grep -q "$PAGE_MARK" /tmp/pages.html && PAGES_OK=yes
          fi
          SUB_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${SUBDOMAIN_URL}?n=$T" 2>/dev/null || echo "000")
          [ "$SUB_CODE" = "200" ] && SUB_OK=yes

          CHAPTERS=$(grep -o 'id="chapter-[a-z0-9-]*"' index.html 2>/dev/null | sort -u | wc -l)

          echo "היום=$TODAY שעה=$HM"
          echo "ריצה מוצלחת אחרונה=${LAST_OK:-לא נקרא} | קומיט אחרון=${LAST_COMMIT:-—} | באוויר=$BUSY"
          echo "Pages=$PAGES_OK | תת-דומיין=$SUB_CODE | פרקים=$CHAPTERS"

          NEED_RUN=false
          if [ "$LAST_OK" != "$TODAY" ] && [ "${BUSY:-0}" = "0" ]; then NEED_RUN=true; fi

          ESCALATE=false
          if [ "$HM" -ge 1600 ] && [ "$NEED_RUN" = "true" ]; then ESCALATE=true; fi
          # GitHub Pages מכובה במאגר הזה (has_pages=false, והמאגר פרטי) —
          # המראה שהשומר חיפש מעולם לא פורסמה. הוא הסלים על היעדרה כל יום,
          # ואזעקה שחוזרת בלי סיבה מאמנת להתעלם מאזעקות. נרשם לידיעה, לא מסלים.
          # אם Pages יופעל בעתיד, החזר את השורה: [ "$PAGES_OK" != "yes" ] && ESCALATE=true
          if [ "$PAGES_OK" != "yes" ]; then
            echo "ℹ️ Pages לא מגיש (מכובה במאגר) — לידיעה בלבד, לא שער כשל"
          fi
          # פחות מ-100 פרקים = המדריך נחתך. סף שמרני; היום יש 132.
          if [ "${CHAPTERS:-0}" -lt 100 ]; then ESCALATE=true; fi

          SUM="היום $TODAY · ריצה מוצלחת אחרונה ${LAST_OK:-לא נקרא} · קומיט ${LAST_COMMIT:-—} · Pages $PAGES_OK · תת-דומיין $SUB_CODE · פרקים $CHAPTERS"

          {
            echo "need_run=$NEED_RUN"
            echo "escalate=$ESCALATE"
            echo "summary=$SUM"
          } >> "$GITHUB_OUTPUT"

          if [ "$NEED_RUN" = "false" ] && [ "$ESCALATE" = "false" ]; then
            echo "✅ הכול תקין — אין התערבות"
          else
            echo "⚠️ מתערבים: need_run=$NEED_RUN escalate=$ESCALATE"
          fi

  heal:
    name: תיקון — הרצה חוזרת של העדכון היומי
    needs: check
    if: needs.check.outputs.need_run == 'true'
    uses: ./.github/workflows/daily-guide-update.yml
    secrets: inherit

  escalate:
    name: הסלמה — Issue לבעל הריפו
    needs: [check, heal]
    if: >-
      always() && (
        needs.check.outputs.escalate == 'true' ||
        needs.heal.result == 'failure'
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 🚨 פתיחת/עדכון Issue
        env:
          GH_TOKEN: ${{ github.token }}
          # ⚠️ إلزامي: وظيفة التصعيد بلا checkout، فلا سياق مستودع لـgh.
          # بدونه يفشل gh بـ"could not determine repository".
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          D=$(TZ=Asia/Jerusalem date +%F)
          TITLE="🚨 המדריך לא התעדכן — $D"
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="השומר ניסה לתקן ולא הצליח.

          מצב: ${{ needs.check.outputs.summary }}
          תוצאת התיקון: ${{ needs.heal.result }}
          לוג הריצה: $URL

          מה לבדוק, לפי הסבירות:
          1. תוקף \`CLAUDE_CODE_OAUTH_TOKEN\` — הסיבה השכיחה ביותר.
          2. שלב הוולידציה בלוג של \`$TARGET_WF\` — איזו בדיקה נפלה.
          3. סודות ה-FTP: \`FTP_SERVER\` · \`FTP_USERNAME\` · \`FTP_PASSWORD\`.
          4. האם שם קובץ או נתיב השתנה — זו הייתה סיבת התקלה של מלטיה ב-25/08/2026."
          NUM=$(gh issue list --state open --limit 50 --json number,title \
                --jq "[.[] | select(.title==\"$TITLE\") | .number] | first // empty" || echo "")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

  # ═══════════════════════════════════════════════════════════════
  # אוחד מ-failure-alarm.yml (24/09/2026). רץ רק כשהעדכון היומי מסתיים —
  # נפרד לגמרי מתהליך התזמון/הבדיקה שמעל.
  # ═══════════════════════════════════════════════════════════════
  alarm_streak:
    name: אזעקה — שני כשלים ברצף
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: guide-watchdog-alarm
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: בדיקת שתי הריצות האחרונות
        id: streak
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # שתי הריצות המושלמות האחרונות של העדכון היומי
          CONCLUSIONS=$(gh api \
            "repos/$REPO/actions/workflows/daily-guide-update.yml/runs?status=completed&per_page=2" \
            --jq '.workflow_runs[].conclusion' | tr '\n' ' ')

          echo "שתי הריצות האחרונות: $CONCLUSIONS"
          COUNT=$(echo "$CONCLUSIONS" | tr ' ' '\n' | grep -c '^failure$' || true)
          TOTAL=$(echo "$CONCLUSIONS" | wc -w)

          # אזעקה רק כששתיהן נכשלו
          if [ "$TOTAL" -ge 2 ] && [ "$COUNT" -ge 2 ]; then
            echo "alarm=true" >> "$GITHUB_OUTPUT"
            echo "🚨 שני כשלים ברצף — מפעיל אזעקה"
          else
            echo "alarm=false" >> "$GITHUB_OUTPUT"
            echo "✅ אין רצף כשלים — שקט"
          fi

      - name: פתיחת Issue (שולח מייל אוטומטית)
        if: steps.streak.outputs.alarm == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          TITLE="🚨 העדכון היומי של המדריך נכשל פעמיים ברצף"

          # אם כבר יש Issue פתוח כזה — רק מוסיפים תגובה, לא מציפים
          EXISTING=$(gh issue list --repo "$REPO" --state open \
            --search "in:title 🚨 העדכון היומי של המדריך נכשל" --json number --jq '.[0].number // empty')

          BODY=$(cat <<EOF
          העדכון האוטומטי של המדריך נכשל **בשתי הריצות האחרונות**. המדריך החי נשמר על הגרסה הקודמת — שום דבר לא נהרס.

          **הריצה שנכשלה:** $RUN_URL

          **מה לבדוק, לפי הסבירות:**

          1. **פג תוקף הטוקן** — הסוד \`CLAUDE_CODE_OAUTH_TOKEN\` הוא הסיבה השכיחה ביותר. הרץ אצלך \`claude setup-token\` ועדכן אותו ב-Settings → Secrets.
          2. **שגיאת FTP** — חפש \`530\` בלוג. אם כן: החלף בקובץ ה-workflow את \`protocol: ftps\` + \`port: 21\` ל-\`protocol: ftps-legacy\` + \`port: 990\`.
          3. **ולידציה נפלה** — שלב "לא פורסים קובץ שבור" עצר בכוונה. הלוג אומר בדיוק איזו בדיקה נכשלה.
          4. **מקור סריקה השתנה** — אם אתר של Anthropic שינה מבנה, הסוכן עלול להיתקע. בדרך כלל נפתר מעצמו למחרת.

          ---
          _נסגר אוטומטית? לא. סגור ידנית אחרי שתיקנת._
          EOF
          )

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
            echo "נוספה תגובה ל-Issue #$EXISTING"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" --label "bug" 2>/dev/null \
              || gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
            echo "נפתח Issue חדש"
          fi
