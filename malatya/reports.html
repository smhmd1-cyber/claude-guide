<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أرشيف التقارير اليومية — منظومة ملاطيا</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🌰%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/malatya.css?v=2">
<style>
.tabs{display:flex;gap:8px;margin:20px 0 6px;flex-wrap:wrap}
.tab{padding:9px 18px;border-radius:12px;border:1px solid var(--border);background:var(--card2);
  color:var(--text2);font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer}
.tab.on{background:var(--accent-soft);border-color:var(--accent-line);color:#ffe6c2}
.split{display:grid;grid-template-columns:290px 1fr;gap:18px;margin-top:16px}
@media(max-width:860px){.split{grid-template-columns:1fr}}
.list{border:1px solid var(--border);border-radius:var(--r);background:linear-gradient(180deg,var(--panel),var(--bg2));
  max-height:72vh;overflow-y:auto;padding:8px}
.list button{display:block;width:100%;text-align:right;background:transparent;border:0;color:var(--text2);
  font-family:var(--font);font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:2px}
.list button:hover{background:var(--card)}
.list button.on{background:var(--accent-soft);color:#ffe6c2}
.list button .d{font-family:var(--font-num);font-size:11.5px;color:var(--muted);display:block;direction:ltr}
.view{border:1px solid var(--border);border-radius:var(--r);background:linear-gradient(180deg,var(--card),var(--bg2));
  padding:24px 26px;min-height:60vh}
.view h1{font-size:24px;font-weight:900;margin:0 0 6px}
.view h2{font-size:19px;margin:26px 0 10px}
.view h3{font-size:16px;margin:18px 0 8px}
.view ul,.view ol{margin:10px 22px;color:var(--text2)}
.view li{margin:5px 0}
.view code{background:var(--card2);padding:2px 6px;border-radius:5px;font-family:var(--font-num);font-size:13px}
.view a{word-break:break-word}
.view table{font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <div class="logo">🗂️</div>
    <div><h1>أرشيف التقارير اليومية</h1><div class="sub">كل ما رصده وكيل العقارات ووكيل الأراضي، يوماً بيوم</div></div>
    <div class="spacer"></div>
    <a class="btn" href="index.html">← مركز التحكّم</a>
  </div>

  <div class="tabs">
    <button class="tab on" data-k="aqar">🏢 العقارات <span class="badge" id="c-aqar">—</span></button>
    <button class="tab" data-k="land">🌾 الأراضي <span class="badge" id="c-land">—</span></button>
  </div>

  <div class="split">
    <div class="list" id="list"></div>
    <article class="view" id="view"><p class="mut">اختر تقريراً من القائمة.</p></article>
  </div>

  <footer class="site">
    <span>🌰 منظومة ملاطيا</span><span>·</span>
    <a href="index.html">مركز التحكّم</a><a href="aqar-board.html">لوحة العقارات</a><a href="land-board.html">لوحة الأراضي</a>
  </footer>
</div>
<script src="assets/nav.js?v=4" defer></script>
<script>
(function(){
  'use strict';
  var AR=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  function fmt(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?((+m[3])+' '+AR[+m[2]-1]+' '+m[1]):(s||'');}
  var ALL=[], cur='aqar';

  function render(){
    var items=ALL.filter(function(r){return r.track===cur;})
                 .sort(function(a,b){return a.date<b.date?1:-1;});
    var L=document.getElementById('list'); L.innerHTML='';
    items.forEach(function(r,i){
      var b=document.createElement('button');
      b.innerHTML='<span class="d">'+r.date+'</span>'+fmt(r.date);
      b.onclick=function(){
        Array.prototype.forEach.call(L.children,function(c){c.classList.remove('on');});
        b.classList.add('on'); open(r);
      };
      L.appendChild(b);
      if(i===0){ b.classList.add('on'); open(r); }
    });
    if(!items.length){ L.innerHTML='<p class="mut" style="padding:12px">لا تقارير.</p>';
      document.getElementById('view').innerHTML='<p class="mut">لا تقارير في هذا المسار.</p>'; }
  }

  function open(r){
    var v=document.getElementById('view');
    v.innerHTML='<p class="mut">… يُحمّل</p>';
    fetch('reports/'+r.file+'?v='+Date.now(),{cache:'no-store'}).then(function(x){ if(!x.ok) throw 0; return x.text(); })
      .then(function(html){ v.innerHTML='<h1>'+(r.track==='land'?'🌾':'🏢')+' تقرير '+fmt(r.date)+'</h1>'+html;
                            v.scrollTop=0; })
      .catch(function(){ v.innerHTML='<div class="note warn">تعذّر تحميل هذا التقرير.</div>'; });
  }

  fetch('data/reports-index.json?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(a){
    ALL=a||[];
    document.getElementById('c-aqar').textContent=ALL.filter(function(r){return r.track==='aqar';}).length;
    document.getElementById('c-land').textContent=ALL.filter(function(r){return r.track==='land';}).length;
    render();
  }).catch(function(){
    document.getElementById('list').innerHTML='<p class="mut" style="padding:12px">تعذّر تحميل الفهرس.</p>';
  });

  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
    t.onclick=function(){
      Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(x){x.classList.remove('on');});
      t.classList.add('on'); cur=t.dataset.k; render();
    };
  });
})();
</script>
</body>
</html>
